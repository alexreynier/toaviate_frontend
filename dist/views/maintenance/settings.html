<div class="mxo-page__header">
  <div class="mxo-page__header-inner">
    <div class="back-box" ui-sref="dashboard.maintenance"><i class="fa fa-arrow-circle-left"></i> BACK</div>
    <div class="mxo-page__title">
      <h2><i class="fas fa-cog"></i> Organisation Settings</h2>
      <p>Contact details and registration</p>
    </div>
  </div>
</div>

<div ng-if="vm.loading" class="mxo-loading"><span class="mxo-spinner"></span> Loading…</div>

<div ng-if="!vm.loading && !vm.is_admin" class="mxo-empty snazzy-reveal">
  <div class="mxo-empty__icon"><i class="fas fa-lock"></i></div>
  <p>Only organisation admins can change these settings.</p>
</div>

<div ng-if="!vm.loading && vm.org && vm.is_admin" class="snazzy-reveal snazzy-reveal--stagger">

  <div class="mxo-card">
    <h3 class="mxo-card__title"><i class="fas fa-building"></i> Organisation details</h3>

    <div class="mxo-form-grid">
      <div class="mxo-field">
        <label>Trading name</label>
        <input id="mxs_title" type="text" ng-model="vm.org.title" ng-focus="vm.clearFieldError($event)" />
      </div>
      <div class="mxo-field">
        <label>Registered company name</label>
        <input type="text" ng-model="vm.org.company_name" />
      </div>
      <div class="mxo-field">
        <label>Company number</label>
        <input type="text" ng-model="vm.org.company_number" />
      </div>
      <div class="mxo-field">
        <label>Approval ref</label>
        <input type="text" ng-model="vm.org.approval_ref" />
      </div>
      <div class="mxo-field mxo-field--full">
        <label>Find the address</label>
        <address-lookup placeholder="Start typing the organisation's address…"
                        on-select="vm.org.address_line_1 = address.line1; vm.org.address_line_2 = address.line2; vm.org.city = address.city; vm.org.post_code = address.postcode; vm.org.country = address.country"></address-lookup>
      </div>
      <div class="mxo-field mxo-field--full">
        <label>Address line 1</label>
        <input type="text" ng-model="vm.org.address_line_1" />
      </div>
      <div class="mxo-field mxo-field--full">
        <label>Address line 2</label>
        <input type="text" ng-model="vm.org.address_line_2" />
      </div>
      <div class="mxo-field">
        <label>City</label>
        <input type="text" ng-model="vm.org.city" />
      </div>
      <div class="mxo-field">
        <label>Postcode</label>
        <input type="text" ng-model="vm.org.post_code" />
      </div>
      <div class="mxo-field">
        <label>Country</label>
        <input type="text" ng-model="vm.org.country" />
      </div>
      <div class="mxo-field">
        <label>Email</label>
        <input id="mxs_email" type="email" ng-model="vm.org.email" ng-focus="vm.clearFieldError($event)" />
      </div>
      <div class="mxo-field">
        <label>Phone</label>
        <input type="tel" ng-model="vm.org.phone_number" />
      </div>
      <div class="mxo-field">
        <label>Website</label>
        <input type="url" ng-model="vm.org.website" />
      </div>
    </div>

    <div style="margin-top:22px; display:flex; gap:8px; justify-content:flex-end;">
      <button class="mxo-btn mxo-btn--primary" ng-click="vm.save()" ng-disabled="vm.saving">
        <i class="fas" ng-class="vm.saving ? 'fa-spinner fa-spin' : 'fa-save'"></i>
        {{ vm.saving ? 'Saving…' : 'Save changes' }}
      </button>
    </div>
  </div>

  <div class="mxo-card" style="border-color:#fecaca; background:#fef2f2;">
    <h3 class="mxo-card__title" style="color:#991b1b;"><i class="fas fa-exclamation-triangle"></i> Danger zone</h3>
    <p style="color:#7f1d1d; margin:0 0 12px;">Deactivating the organisation prevents it from being assigned to any club aircraft. Members will lose access.</p>
    <button class="mxo-btn mxo-btn--danger" ng-click="vm.deactivate()">
      <i class="fas fa-power-off"></i> Deactivate organisation
    </button>
  </div>

</div>
