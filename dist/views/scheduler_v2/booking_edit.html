<!-- Scheduler v2 — Edit booking panel (state dashboard.scheduler_v2.edit, view
     panel@dashboard.scheduler_v2, Bookings2Controller as vm, data.action 'edit' +
     data.v2). Slides in over the scheduler, which stays mounted behind it.
     Chrome here; the form body is the shared _booking_form.html. -->
<div class="bkf">
  <div class="bkf-backdrop" ng-click="vm.bkf_dismiss()"></div>
  <aside class="bkf-panel" role="dialog" aria-modal="true" aria-label="Edit booking">
    <header class="bkf-panel__hd">
      <div class="bkf-panel__title">
        <h2><i class="fa fa-calendar-alt"></i> Edit booking</h2>
        <p ng-if="vm.new_booking.plane.registration || vm.new_booking.plane.title">{{ vm.new_booking.plane.registration || vm.new_booking.plane.title }} · {{ vm.new_booking.start_date | date:'EEE d MMM' }} {{ vm.new_booking.start_time.time }}–{{ vm.new_booking.end_time.time }}</p>
        <p ng-if="!(vm.new_booking.plane.registration || vm.new_booking.plane.title)">Change this reservation</p>
      </div>
      <button type="button" class="bkf-panel__close" ng-click="vm.go_back()" aria-label="Close" uib-tooltip="Back to the scheduler" tooltip-placement="bottom-right" tooltip-append-to-body="true"><i class="fa fa-times"></i></button>
    </header>
    <div class="bkf-panel__body" ng-include="'views/scheduler_v2/_booking_form.html'"></div>
  </aside>
</div>
