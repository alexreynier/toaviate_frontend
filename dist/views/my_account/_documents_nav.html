<!-- Shared chrome (header + sub-nav) for the consolidated "My Documents" hub.
     ng-included at the top of: licence.html, medical.html,
     differences.html and poid.html. Routes/controllers are untouched
     apart from exposing vm.state — this is navigation chrome only.
     Reuses the .mdnav pill styles from css/account.css; shared page
     geometry is .dochub-page (same file).

     Proof of ID is club-only (matches its tile gate on home.html);
     the other three are personal records every account gets.

     The WHOLE block is hidden on the add/edit child states. Those forms
     render their own snazzy header inside the parent's ui-view, so
     leaving this up gave two stacked headers with two BACK buttons.
     vm.state is $state (exposed by each of the four controllers);
     .$current.name is the LEAF state, so this is true only while a
     list view is showing. -->
<div ng-if="vm.state.$current.name === 'dashboard.my_account.licence'
         || vm.state.$current.name === 'dashboard.my_account.medical'
         || vm.state.$current.name === 'dashboard.my_account.differences'
         || vm.state.$current.name === 'dashboard.my_account.poid'">

    <div class="snazzy-page__header">
        <div class="snazzy-page__header-inner">
            <div class="back-box" ui-sref="dashboard.my_account">
                <i class="fa fa-arrow-circle-left"></i> BACK
            </div>
            <div class="snazzy-page__title">
                <h2><i class="fas fa-folder-open"></i> My Documents</h2>
                <p>Licences, medicals, differences training and proof of ID</p>
            </div>
        </div>
    </div>

    <div class="mdnav">
        <a class="mdnav__pill" ui-sref="dashboard.my_account.licence" ui-sref-active="mdnav__pill--active">
            <i class="fas fa-certificate"></i> Licences
        </a>
        <a class="mdnav__pill" ui-sref="dashboard.my_account.medical" ui-sref-active="mdnav__pill--active">
            <i class="fas fa-briefcase-medical"></i> Medicals
        </a>
        <a class="mdnav__pill" ui-sref="dashboard.my_account.differences" ui-sref-active="mdnav__pill--active">
            <i class="fas fa-random"></i> Differences
        </a>
        <a class="mdnav__pill" ui-sref="dashboard.my_account.poid" ui-sref-active="mdnav__pill--active"
           ng-if="vm.user.access.show_booking">
            <i class="fas fa-id-badge"></i> Proof of ID
        </a>
    </div>
</div>
