<form name="nok" ng-submit="save_nok(nok.$valid)" novalidate>

    <div class="sec-card nok-form">
        <div class="sec-card__head">
            <i class="fas sec-card__icon" ng-class="vm.nok.id ? 'fa-user-edit' : 'fa-user-plus'"></i>
            <div>
                <h3 class="sec-card__title">{{ vm.nok.id ? 'Edit' : 'Add' }} Emergency Contact</h3>
                <p class="sec-card__sub">All fields are required</p>
            </div>
        </div>
        <div class="sec-card__body">

            <div class="acct-fields acct-fields--two">
                <div class="acct-field">
                    <label for="first_name">First name</label>
                    <input type="text" class="acct-input" id="first_name" name="first_name" ng-model="vm.nok.first_name" ng-focus="vm.clearFieldError($event)" required>
                </div>
                <div class="acct-field">
                    <label for="last_name">Last name</label>
                    <input type="text" class="acct-input" id="last_name" name="last_name" ng-model="vm.nok.last_name" ng-focus="vm.clearFieldError($event)" required>
                </div>
            </div>

            <div class="acct-fields acct-fields--two">
                <div class="acct-field">
                    <label for="phone_number">Phone number</label>
                    <input type="text" class="acct-input" id="phone_number" name="phone_number" ng-model="vm.nok.phone_number" ng-focus="vm.clearFieldError($event)" required>
                </div>
                <div class="acct-field">
                    <label for="relationship">Relationship</label>
                    <input type="text" class="acct-input" id="relationship" name="relationship" ng-model="vm.nok.relationship" ng-focus="vm.clearFieldError($event)" placeholder="e.g. Partner, Parent" required>
                </div>
            </div>

            <div class="acct-field">
                <label for="address">Address</label>
                <address-lookup placeholder="Start typing their address…"
                                on-select="vm.nok.address = address.formatted || address.line1"></address-lookup>
                <textarea class="acct-input" rows="4" id="address" name="address" ng-model="vm.nok.address" ng-focus="vm.clearFieldError($event)" required></textarea>
            </div>

            <div class="nok-form__btns">
                <button type="button" ui-sref="dashboard.my_account.nok" class="sec-btn sec-btn--outline">Cancel</button>
                <button type="submit" class="sec-btn sec-btn--primary">
                    <i class="fas fa-check"></i> Save next of kin
                </button>
            </div>

        </div>
    </div>

</form>
