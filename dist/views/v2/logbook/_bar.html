<!-- v2 logbook — the one page bar for the hub (Logbook · Statistics · Import), with Export and Add flight.
     Included by logbook.html, stats.html, import.html and skydemon.html (LogbookV2Controller as vm). -->
<section class="ta-bar">
  <div class="ta-bar__row">
    <div class="ta-bar__title">
      <span class="ta-bar__icon" aria-hidden="true"><i class="fas fa-book"></i></span>
      <div>
        <h2>My logbook</h2>
        <p>Your club flights and the flights you’ve added, together</p>
        <design-back class="lgb-designback"></design-back>
      </div>
    </div>
    <span class="lgb-bar-r">
      <span class="lgb-mw ta-phone-only" ng-if="vm.tab === 'logbook' && vm.entries.length">
        <button type="button" class="ta-back" ng-click="vm.toggleMenu('export', $event)" aria-label="Export your logbook" aria-expanded="{{ vm.menu === 'export' ? 'true' : 'false' }}" no-busy-guard>
          <i class="fas" ng-class="vm.exporting ? 'fa-spinner fa-spin' : 'fa-download'" aria-hidden="true"></i>
        </button>
        <span class="lgb-bd" ng-if="vm.menu === 'export'" ng-click="vm.menu = null"></span>
        <span class="lgb-menu" role="menu" ng-if="vm.menu === 'export'">
          <span class="lgb-menu__k">{{ vm.exportScope }}, with a totals summary and where each flight came from.</span>
          <button type="button" class="lgb-menu__it" role="menuitem" ng-click="vm.exportAs('csv')" no-busy-guard><i class="fas fa-file-csv" aria-hidden="true"></i><b>CSV file</b><small>Opens in any spreadsheet</small></button>
          <button type="button" class="lgb-menu__it" role="menuitem" ng-click="vm.exportAs('excel')" no-busy-guard><i class="fas fa-file-excel" aria-hidden="true"></i><b>Excel file</b><small>.xls, UK CAA column order</small></button>
        </span>
      </span>
      <a class="ta-back" ui-sref="dashboard.my_account" aria-label="Back to My Account"><i class="fas fa-arrow-left" aria-hidden="true"></i><span class="ta-back__txt">My Account</span></a>
    </span>
  </div>
  <div class="ta-bar__row ta-bar__row--tools">
    <div class="ta-tabs" role="tablist">
      <button type="button" class="ta-tab" ng-class="{'ta-tab--on': vm.tab === 'logbook'}" role="tab" aria-selected="{{ vm.tab === 'logbook' ? 'true' : 'false' }}" ng-click="vm.go('logbook')" no-busy-guard><i class="fas fa-book" aria-hidden="true"></i>Logbook</button>
      <button type="button" class="ta-tab" ng-class="{'ta-tab--on': vm.tab === 'stats'}" role="tab" aria-selected="{{ vm.tab === 'stats' ? 'true' : 'false' }}" ng-click="vm.go('stats')" no-busy-guard><i class="fas fa-chart-bar" aria-hidden="true"></i>Statistics</button>
      <button type="button" class="ta-tab" ng-class="{'ta-tab--on': vm.tab === 'import'}" role="tab" aria-selected="{{ vm.tab === 'import' ? 'true' : 'false' }}" ng-click="vm.go('import')" no-busy-guard><i class="fas fa-file-import" aria-hidden="true"></i>Import</button>
    </div>
    <div class="lgb-acts">
      <span class="lgb-mw ta-desk-only" ng-if="vm.tab === 'logbook' && vm.entries.length">
        <button type="button" class="ta-btn" ng-click="vm.toggleMenu('export', $event)" aria-expanded="{{ vm.menu === 'export' ? 'true' : 'false' }}" ng-disabled="vm.exporting" no-busy-guard>
          <i class="fas" ng-class="vm.exporting ? 'fa-spinner fa-spin' : 'fa-download'" aria-hidden="true"></i>Export<i class="fas fa-chevron-down" aria-hidden="true"></i>
        </button>
        <span class="lgb-bd" ng-if="vm.menu === 'export'" ng-click="vm.menu = null"></span>
        <span class="lgb-menu" role="menu" ng-if="vm.menu === 'export'">
          <span class="lgb-menu__k">{{ vm.exportScope }}, with a totals summary and where each flight came from.</span>
          <button type="button" class="lgb-menu__it" role="menuitem" ng-click="vm.exportAs('csv')" no-busy-guard><i class="fas fa-file-csv" aria-hidden="true"></i><b>CSV file</b><small>Opens in any spreadsheet</small></button>
          <button type="button" class="lgb-menu__it" role="menuitem" ng-click="vm.exportAs('excel')" no-busy-guard><i class="fas fa-file-excel" aria-hidden="true"></i><b>Excel file</b><small>.xls, UK CAA column order</small></button>
        </span>
      </span>
      <button type="button" class="ta-btn ta-btn--primary ta-desk-only" ng-if="!vm.loading" ng-click="vm.go('entry')" no-busy-guard><i class="fas fa-plus" aria-hidden="true"></i>Add flight</button>
    </div>
  </div>
</section>
