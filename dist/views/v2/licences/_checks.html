<!-- one row per live club for a licence / medical (needs `rec` with _checks, and `what`) — member_checks/v2/mine (C9) -->
<div class="lic-sec" ng-if="rec._checks.length">
    <span class="ta-sec-k">Club checks</span>
    <div class="lic-checks">
        <div class="lic-check" ng-repeat="c in rec._checks" ng-class="{'lic-check--pend': !c.verified}">
            <span class="ta-ic ta-ic--sm" ng-class="{'ta-ic--good': c.verified}"><i class="fas" ng-class="c.verified ? 'fa-user-check' : 'fa-user-clock'"></i></span>
            <span class="lic-check__txt"><b>{{ c.club }}</b><small>{{ vm.checkLine(c, what) }}</small></span>
            <span class="ta-pill ta-pill--good" ng-if="c.verified"><i class="fas fa-user-check"></i>Checked</span>
            <span class="ta-pill ta-pill--pend" ng-if="!c.verified"><i class="fas fa-user-clock"></i>Awaiting club check</span>
        </div>
    </div>
</div>
