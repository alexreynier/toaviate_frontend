<!-- the hub summary: the licence, the rating and the medical class that run out first (club checks tile: hidden until member_checks/v2/mine) -->
<div class="ta-tiles lic-tiles" ng-if="vm.tileList.length">
    <div class="ta-tile" ng-repeat="t in vm.tileList" ng-class="{'ta-tile--attn': t.tone === 'attn', 'ta-tile--bad': t.tone === 'bad', 'ta-tile--good': t.tone === 'good', 'ta-tile--progress': t.tone === 'progress'}">
        <span class="ta-tile__k"><i class="fas" ng-class="t.ic"></i>{{ t.k }}</span>
        <span class="ta-tile__v" ng-class="{'ta-tile__v--quiet': t.tone === 'quiet'}">{{ t.v }}</span>
        <span class="ta-tile__s">{{ t.s }}</span>
        <button type="button" class="ta-tile__go" ng-if="t.go" ng-click="vm.tileGo(t)" no-busy-guard>{{ t.goL }} <i class="fas fa-arrow-right"></i></button>
    </div>
</div>
