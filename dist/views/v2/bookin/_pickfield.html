<!-- a picker field (picker A: .ta-pick + .ta-pickmenu) — bki-pick-field="pic|put|instr|course|tuition" (scope.pf) -->
<button type="button" class="ta-pick" ng-class="{'ta-pick--empty': !vm.bk_pf(pf).nm}" ng-click="vm.bk_pk_open(pf)" aria-haspopup="listbox" aria-expanded="{{ vm.bk.pk.f === pf }}" data-e2e="bki-pick-{{ pf }}">
  <span class="ta-av" ng-if="vm.bk_pf(pf).person && vm.bk_is_instr(vm.bk_pf(pf).person)" style="--av: {{ vm.bk_colour(vm.bk_pf(pf).person) }}" title="{{ vm.bk_pf(pf).nm }} (instructor)">{{ vm.bk_initials(vm.bk_pf(pf).person) }}</span>
  <span class="ta-av ta-av--member" ng-if="vm.bk_pf(pf).person && !vm.bk_is_instr(vm.bk_pf(pf).person)" title="Member"><i class="fas fa-user"></i></span>
  <span class="ta-av ta-av--member" ng-if="!vm.bk_pf(pf).person && !vm.bk_pf(pf).icon"><i class="fas fa-user-plus"></i></span>
  <span class="ta-pick__ic" ng-if="vm.bk_pf(pf).icon"><i class="fas {{ vm.bk_pf(pf).icon }}"></i></span>
  <span class="ta-pick__txt"><span class="ta-pick__nm">{{ vm.bk_pf(pf).nm || 'Choose…' }}<span class="bki-bs" ng-if="vm.bk_pf(pf).bs">BookedScheduler</span></span><span class="ta-pick__sub" ng-if="vm.bk_pf(pf).nm && vm.bk_pf(pf).sub">{{ vm.bk_pf(pf).sub }}</span></span>
  <span class="ta-pick__end">{{ vm.bk_pf(pf).nm ? 'Change' : 'Choose' }} <i class="fas fa-chevron-down"></i></span>
</button>
<div ng-if="vm.bk.pk.f === pf" ng-include="'views/v2/bookin/_pickmenu.html'"></div>
