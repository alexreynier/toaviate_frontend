<!-- The GoCardless hand-off, explained before you leave (Memberships and Membership pages). vm.dlg = { mode: 'setup'|'update', busy, steps } -->
<div class="ta-dlg-scrim" ng-if="vm.dlg" mem-portal data-e2e="mem-gcl-dlg" ng-click="vm.closeDlg()" no-busy-guard>
  <div class="ta-dlg" role="dialog" aria-modal="true" aria-labelledby="mem-dlg-t" ng-click="$event.stopPropagation()" no-busy-guard>
    <div class="ta-dlg__hd ta-dlg__hd--alert">
      <div class="ta-dlg__grab"></div>
      <span class="ta-dlg__ic" aria-hidden="true"><i class="fas fa-university"></i></span>
      <div>
        <div class="ta-dlg__title" id="mem-dlg-t">{{ vm.dlg.mode === 'update' ? 'Update your bank details' : 'Set up a direct debit' }}</div>
        <div class="ta-dlg__sub">With {{ vm.dlg.m ? vm.dlg.m.title : vm.title }}, on GoCardless' secure page</div>
      </div>
      <button type="button" class="ta-dlg__x" ng-click="vm.closeDlg()" ng-disabled="vm.dlg.busy" aria-label="Close">×</button>
    </div>
    <div class="ta-dlg__body">
      <ol class="mem-flow mem-flow--dlg">
        <li ng-repeat="s in vm.dlg.steps"><b>{{ s[0] }}</b><span>{{ s[1] }}</span></li>
      </ol>
      <div class="ta-note"><i class="fas fa-shield-alt" aria-hidden="true"></i><div>Protected by the Direct Debit Guarantee. You can cancel it with your bank at any time.</div></div>
    </div>
    <div class="ta-dlg__ft">
      <button type="button" class="ta-btn ta-btn--quiet" ng-click="vm.closeDlg()" ng-disabled="vm.dlg.busy">Cancel</button>
      <span class="ta-sp"></span>
      <button type="button" class="ta-btn ta-btn--primary" ng-click="vm.gclGo()" ng-disabled="vm.dlg.busy" data-e2e="mem-gcl-go" no-busy-guard>
        <span class="ta-spin" ng-if="vm.dlg.busy"></span><span ng-if="vm.dlg.busy">Opening GoCardless…</span>
        <span ng-if="!vm.dlg.busy">Continue to GoCardless</span><i class="fas fa-external-link-alt" ng-if="!vm.dlg.busy" aria-hidden="true"></i></button>
    </div>
  </div>
</div>
