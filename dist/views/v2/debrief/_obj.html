<span class="dbf-obj__n" aria-hidden="true"><i class="fas fa-check" ng-if="vm.S.grades[it.id]"></i>{{ vm.S.grades[it.id] ? '' : idx }}</span>
<div class="dbf-obj__t"><b ng-bind-html="vm.hlq(it.t)"></b><span class="dbf-obj__k" ng-if="it.k">{{ it.k }}{{ vm.S.grades[it.id] ? '' : ' · ' }}<span class="dbf-sub" ng-if="!vm.S.grades[it.id]">not graded</span></span><span class="dbf-obj__k" ng-if="!it.k && !vm.S.grades[it.id]">Not graded</span><button type="button" class="dbf-obj__quote" ng-if="vm.S.rmkOpen !== it.id && vm.rmkText(it.id)" ng-click="vm.rmkOpen(it)" title="Edit the remark"><i class="fas fa-comment-dots"></i><span>{{ vm.S.rmk[it.id] }}</span></button><button type="button" class="ta-link dbf-obj__add" ng-if="vm.S.rmkOpen !== it.id && !vm.rmkText(it.id)" ng-click="vm.rmkOpen(it)"><i class="fas fa-plus"></i>Remark</button></div>
<div class="dbf-grade" ng-class="{'dbf-grade--wrap': vm.D.scale.length >= 5}" role="radiogroup" aria-label="Grade: {{ it.t }}" ng-attr-style="--n: {{ vm.D.scale.length }}"><button type="button" class="dbf-grade__o" ng-repeat="g in vm.D.scale track by g.id" ng-class="{'dbf-grade__o--plain': !g.c}" role="radio" aria-checked="{{ vm.S.grades[it.id] == g.id }}" ng-click="vm.grade(it, g)" title="{{ g.t }} · key {{ $index + 1 }}" ng-attr-style="{{ g.vars || undefined }}" data-e2e="dbf-g-{{ $index + 1 }}"><i class="fas" ng-class="vm.S.grades[it.id] == g.id ? 'fa-check' : g.ic"></i><span>{{ g.t }}</span></button></div>
<div class="dbf-obj__rm" ng-if="vm.S.rmkOpen === it.id"><textarea class="ta-textarea" id="dbf-rm-{{ it.id }}" ng-model="vm.S.rmk[it.id]" placeholder="Remark on “{{ it.t }}” (optional)"></textarea><div class="dbf-row"><span class="dbf-sub">Kept with this objective on {{ vm.who }}'s record.</span><button type="button" class="ta-btn ta-btn--sm" ng-click="vm.rmkDone()">Done</button></div></div>
