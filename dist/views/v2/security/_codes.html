<!-- show-once recovery codes (needs `codes` in scope) -->
<div class="ta-note ta-note--warn"><i class="fas fa-exclamation-triangle"></i><div><b>Save these now — we can't show them again.</b> Each code signs you in once if you can't use your phone. Type them exactly as shown.</div></div>
<ol class="sc-codes" aria-label="Recovery codes"><li ng-repeat="c in codes track by $index"><span>{{ $index + 1 }}</span><code>{{ c }}</code></li></ol>
<div class="sc-codes__acts">
    <button type="button" class="ta-btn ta-btn--sm" ng-click="vm.codesCopy(codes)" no-busy-guard><i class="fas" ng-class="vm.copied ? 'fa-check' : 'fa-copy'"></i>{{ vm.copied ? 'Copied' : 'Copy all' }}</button>
    <button type="button" class="ta-btn ta-btn--sm" ng-click="vm.codesDl(codes)" no-busy-guard><i class="fas fa-download"></i>Download as a text file</button>
</div>
<label class="ta-check"><input type="checkbox" ng-model="vm.codesSaved" no-busy-guard> I've saved these codes somewhere safe</label>
