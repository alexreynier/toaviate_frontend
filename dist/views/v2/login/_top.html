<!-- the sign-in pages' own site header (they live outside the app shell): the logo, Main website, Sign in (lit on
     the sign-in page itself). vm.page comes from the page's controller: 'signin' | 'forgot' | 'reset'. -->
<header class="lg-top">
  <a class="lg-logo" href="https://toaviate.com" aria-label="ToAviate"><img src="images/main_logo.png" alt="ToAviate"></a>
  <nav class="lg-top__links">
    <a href="https://toaviate.com">Main website</a>
    <a ui-sref="login_v2" ng-class="{on: vm.page === 'signin'}">Sign in</a>
  </nav>
</header>
