<!-- "Confirm it's you" before encrypted ID images open (the backend's 5-minute re-login: fail "templogin" → users/login3) -->
<div class="ta-dlg-scrim pro-scrim" ng-if="vm.dlg === 'reveal'" ng-click="vm.scrim($event)">
    <form class="ta-dlg" role="dialog" aria-modal="true" aria-labelledby="pro-rv-t" ng-submit="vm.revealDo()" novalidate>
        <div class="ta-dlg__hd ta-dlg__hd--alert">
            <span class="ta-dlg__ic"><i class="fas fa-lock"></i></span>
            <div><div class="ta-dlg__title pro-dlg-t" id="pro-rv-t">Confirm it's you</div><div class="ta-dlg__sub">Your ID images are encrypted. Enter your password to open them.</div></div>
            <button type="button" class="ta-dlg__x" ng-click="vm.close()" aria-label="Close" no-busy-guard>×</button>
        </div>
        <div class="ta-dlg__body">
            <p class="pro-dlg-hint">You signed in more than 5 minutes ago. The images stay open until you leave this page.</p>
            <div class="ta-field" ng-class="{'ta-field--error': vm.cpwErr}">
                <label class="ta-label" for="pro-cur-pw">Password</label>
                <input class="ta-input" id="pro-cur-pw" type="password" autocomplete="current-password" ng-model="vm.cpw" ng-change="vm.cpwErr = null" ng-disabled="vm.checking">
                <span class="ta-field__msg" ng-if="vm.cpwErr">{{ vm.cpwErr }}</span>
            </div>
        </div>
        <div class="ta-dlg__ft">
            <button type="button" class="ta-btn" ng-click="vm.close()" ng-disabled="vm.checking" no-busy-guard>Cancel</button><span class="ta-sp"></span>
            <button type="submit" class="ta-btn ta-btn--primary" ng-disabled="vm.checking"><i class="fas" ng-class="vm.checking ? 'fa-circle-notch fa-spin' : 'fa-eye'"></i>{{ vm.checking ? 'Opening…' : 'Show images' }}</button>
        </div>
    </form>
</div>
