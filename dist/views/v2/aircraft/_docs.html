<!-- the documents of one aircraft (expects `p`) -->
<div>
  <span class="ta-sec-k">Airworthiness &amp; insurance</span>
  <div class="acs-rows">
    <div class="acs-doc" ng-repeat="d in p._docs track by d.k">
      <span class="ta-ic acs-doc__ic" ng-class="{'ta-ic--bad': d.tone === 'bad', 'ta-ic--warn': d.tone === 'warn'}"><i class="fas" ng-class="d.ic"></i></span>
      <span class="acs-doc__txt"><span class="acs-doc__t">{{ d.t }}</span><span class="acs-doc__s">{{ d.sub }}</span></span>
      <span class="acs-doc__pill"><span class="ta-pill" ng-class="'ta-pill--' + d.pill.tone"><i class="fas" ng-class="d.pill.ic" ng-show="d.pill.ic"></i>{{ d.pill.label }}</span></span>
      <button type="button" class="ta-ib acs-doc__open" ng-if="d.file" title="Open {{ d.t }}" aria-label="Open {{ d.t }}" ng-click="vm.openDoc(p, d)" no-busy-guard><i class="fas fa-external-link-alt"></i></button>
      <span class="acs-doc__open" ng-if="!d.file"></span>
    </div>
  </div>
</div>
<div ng-if="p.documents && p.documents.length">
  <span class="ta-sec-k">Other documents</span>
  <div class="acs-rows">
    <div class="acs-doc" ng-repeat="o in p.documents track by $index">
      <span class="ta-ic acs-doc__ic"><i class="fas" ng-class="vm.fileIcon(o.document)"></i></span>
      <span class="acs-doc__txt"><span class="acs-doc__t">{{ o.title }}</span><span class="acs-doc__s">Updated {{ vm.fDate(o.updated_at) }}</span></span>
      <span class="acs-doc__pill"></span>
      <button type="button" class="ta-ib acs-doc__open" title="Open {{ o.title }}" aria-label="Open {{ o.title }}" ng-click="vm.openOtherDoc(p, o)" no-busy-guard><i class="fas fa-external-link-alt"></i></button>
    </div>
  </div>
</div>
