<!-- one flight, compact (expects `l`; included INTO a .acs-mini row): PIC (+ PUT), date · from → to · brakes off → on, block time -->
  <span class="ta-av" ng-if="l._picIns" ng-attr-style="{{ l._insColour ? '--av:' + l._insColour : undefined }}" title="{{ l._pic.full }} (instructor)">{{ l._picInitials }}</span>
  <span class="ta-av ta-av--member" ng-if="!l._picIns" title="Member"><i class="fas fa-user"></i></span>
  <span>
    <span class="acs-crew acs-crew--inline">
      <span class="acs-crew__r"><span class="acs-role" title="Pilot in command">PIC</span><span>{{ l._pic ? l._pic.short : 'Not recorded' }}</span><span class="ta-tag" ng-if="l._solo">Solo</span></span>
      <span class="acs-crew__r" ng-if="l._put"><span class="acs-role" title="Pilot under training">PUT</span><span>{{ l._put.short }}</span></span>
    </span>
    <span class="acs-mini__s">{{ vm.dayLabel(l.flight_date) }} · {{ l._from }} → {{ l._to }} · Brakes {{ l._t.from }} → {{ l._t.to }}</span>
  </span>
  <span class="acs-dur">{{ l._t.durationHM || '—' }}</span>
