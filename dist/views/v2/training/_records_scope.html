<div class="ta-scope" ng-show="vm.courses.length > 1">
  <span class="ta-scope__k">Course</span>
  <div class="ta-scope__set" role="group" aria-label="Course">
    <button type="button" class="ta-scope__opt" ng-repeat="c in vm.courses" ng-class="{'ta-scope__opt--on': vm.course.id === c.id}" aria-pressed="{{ vm.course.id === c.id }}" ng-click="vm.pick(c)" title="{{ c.club }}" no-busy-guard>{{ c.title }}</button>
  </div>
</div>
