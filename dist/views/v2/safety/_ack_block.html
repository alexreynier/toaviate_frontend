<!-- the acknowledge block inside an opened item (expects `a` on the scope) -->
<div class="ta-note ta-note--good" ng-if="a.acknowledged" ng-class="{'saf-pop': a._just}"><i class="fas fa-check-circle"></i><div><b>Acknowledged {{ vm.whenText(a.acknowledged_at) }}</b><br>Signed “{{ a.signature_name }}”. The club keeps this as your signature.</div></div>
<div class="saf-ackblock" ng-if="!a.acknowledged">
  <label class="ta-toggle ta-toggle--warn">
    <input type="checkbox" class="ta-toggle__input" ng-model="a._read" data-e2e="saf-ack-read">
    <span class="ta-toggle__txt">
      <span class="ta-toggle__t"><i class="fas" ng-class="a._read ? 'fa-check-circle' : 'fa-book-reader'"></i>I have read and understood this</span>
      <span class="ta-toggle__s">{{ a._read ? 'Now check your name and press Acknowledge.' : 'Turn this on once you’ve read it all.' }}</span>
    </span>
    <span class="ta-switch"></span>
  </label>
  <div class="ta-field" ng-class="{'ta-field--error': vm.sigErr}">
    <label class="ta-label" for="saf-sig-{{ a.id }}"><i class="fas fa-signature"></i>Signing as</label>
    <input class="ta-input ta-input--prefilled" id="saf-sig-{{ a.id }}" ng-model="vm.sig" ng-change="vm.onSig()" autocomplete="name">
    <span class="ta-field__msg" ng-show="vm.sigErr">Type your full name — it’s your signature</span>
    <span class="ta-hint" ng-show="!vm.sigErr">Your typed name, the date and your connection’s IP address are kept as your signature.</span>
  </div>
  <div class="ta-detail__foot">
    <button type="button" class="ta-btn ta-btn--quiet" ng-click="vm.later()" no-busy-guard>Later</button>
    <span class="ta-sp"></span>
    <span class="saf-ackhint" ng-show="!a._read">Turn on the switch first</span>
    <button type="button" class="ta-btn ta-btn--primary" ng-click="vm.ack(a)" ng-disabled="!a._read || a._signing" data-e2e="saf-ack-go"><i class="fas fa-file-signature"></i>Acknowledge</button>
  </div>
</div>
