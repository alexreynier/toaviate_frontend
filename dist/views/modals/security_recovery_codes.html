<div class="sec-modal">

    <div class="sec-modal__header">
        <i class="fas fa-sync-alt sec-modal__header-icon"></i>
        <h3 class="sec-modal__title">New Recovery Codes</h3>
    </div>

    <!-- ── Step 1 — confirm password ── -->
    <div class="sec-modal__body" ng-show="vm.step === 'password'">
        <p class="sec-modal__text">
            This generates 10 fresh recovery codes and <b>invalidates all your
            previous codes immediately</b>. Confirm your password to continue.
        </p>
        <form ng-submit="vm.submit()">
            <label class="sec-modal__label" for="recovery-password">Your password</label>
            <input type="password" id="recovery-password" class="sec-modal__input"
                   ng-model="vm.password" autocomplete="current-password" />
            <div class="sec-modal__footer">
                <button type="button" class="sec-btn sec-btn--outline" ng-click="vm.cancel()" ng-disabled="vm.busy">Cancel</button>
                <button type="submit" class="sec-btn sec-btn--primary" ng-disabled="vm.busy">
                    {{ vm.busy ? 'Generating…' : 'Generate new codes' }}
                </button>
            </div>
        </form>
    </div>

    <!-- ── Step 2 — the codes (shown ONCE, ever) ── -->
    <div class="sec-modal__body" ng-show="vm.step === 'codes'">
        <div class="sec-warning">
            <i class="fas fa-exclamation-triangle"></i>
            <div>
                <b>Save these codes now — they cannot be shown again.</b>
                Your old codes have already stopped working.
            </div>
        </div>

        <div class="sec-codes">
            <code class="sec-codes__code" ng-repeat="c in vm.recovery_codes track by $index">{{ c }}</code>
        </div>

        <div class="sec-codes__actions">
            <button type="button" class="sec-btn sec-btn--outline" ng-click="vm.copyCodes()">
                <i class="fas" ng-class="vm.copied ? 'fa-check' : 'fa-copy'"></i> {{ vm.copied ? 'Copied' : 'Copy all' }}
            </button>
            <button type="button" class="sec-btn sec-btn--outline" ng-click="vm.downloadCodes()">
                <i class="fas fa-download"></i> Download
            </button>
        </div>

        <label class="sec-checkline">
            <input type="checkbox" ng-model="vm.codesSaved" />
            <span>I have saved these codes somewhere safe</span>
        </label>

        <div class="sec-modal__footer">
            <button type="button" class="sec-btn sec-btn--primary" ng-click="vm.done()" ng-disabled="!vm.codesSaved">
                Finish
            </button>
        </div>
    </div>

</div>
