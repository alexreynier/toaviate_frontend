<div class="sec-modal">

    <div class="sec-modal__header">
        <i class="fas fa-envelope sec-modal__header-icon"></i>
        <h3 class="sec-modal__title">Add an External Endorsement</h3>
    </div>

    <div class="sec-modal__body">
        <p class="sec-modal__text">
            <b>{{ vm.entry.flight_date }}</b> · {{ vm.entry.registration }} —
            record a signature from an instructor or examiner outside ToAviate.
            We'll email them a link to confirm it.
        </p>

        <form ng-submit="vm.submit()">

            <div class="acct-fields acct-fields--two">
                <div class="acct-field">
                    <label class="sec-modal__label" for="end-ext-name">Instructor / examiner full name</label>
                    <input type="text" id="end-ext-name" class="sec-modal__input" ng-model="vm.form.instructor_name" />
                </div>
                <div class="acct-field">
                    <label class="sec-modal__label" for="end-ext-number">Instructor / examiner number (optional)</label>
                    <input type="text" id="end-ext-number" class="sec-modal__input" ng-model="vm.form.instructor_number" placeholder="e.g. 501685A" />
                </div>
            </div>

            <label class="sec-modal__label" for="end-ext-email">Instructor email</label>
            <input type="email" id="end-ext-email" class="sec-modal__input" ng-model="vm.form.instructor_email"
                   placeholder="They'll receive a confirmation link" />

            <label class="sec-modal__label" for="end-ext-text">Endorsement wording</label>
            <div class="end-wordings">
                <button type="button" class="end-wordings__chip" ng-repeat="w in vm.wordings"
                        ng-class="{'end-wordings__chip--on': vm.form.endorsement_text === w}"
                        ng-click="vm.pickWording(w)">{{ w }}</button>
            </div>
            <textarea id="end-ext-text" class="sec-modal__input" rows="2" ng-model="vm.form.endorsement_text"
                      placeholder="e.g. Training Flight(s) iaw FCL.740.A(b)(1)(ii)"></textarea>

            <label class="sec-modal__label">
                Signature (optional — hand your device to the instructor to sign now,
                or they can sign on the confirmation page)
            </label>
            <sig-pad ng-model="vm.form.signature_image"></sig-pad>

            <div class="sec-modal__footer">
                <button type="button" class="sec-btn sec-btn--outline" ng-click="vm.cancel()" ng-disabled="vm.busy">Cancel</button>
                <button type="submit" class="sec-btn sec-btn--primary" ng-disabled="vm.busy">
                    <i class="fas" ng-class="vm.busy ? 'fa-spinner fa-spin' : 'fa-stamp'"></i>
                    {{ vm.busy ? 'Saving…' : 'Record endorsement' }}
                </button>
            </div>
        </form>
    </div>

</div>
