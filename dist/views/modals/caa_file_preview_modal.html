<!-- CAA forms — attached-document preview (decrypted server-side and
     delivered as a data URI; there is deliberately NO public file URL). -->
<div class="sec-modal">
    <div class="sec-modal__header">
        <i class="fas fa-paperclip sec-modal__header-icon"></i>
        <h3 class="sec-modal__title">{{ vm.file.document_label || vm.file.label || vm.file.filename || 'Document' }}</h3>
    </div>

    <div class="sec-modal__body">
        <div class="caa-preview">
            <img class="caa-preview__img" ng-if="!vm.isPdf" ng-src="{{ vm.data_uri }}" alt="Document preview" />
            <iframe class="caa-preview__pdf" ng-if="vm.isPdf" ng-src="{{ vm.data_uri }}"></iframe>
        </div>

        <div class="sec-modal__footer">
            <button type="button" class="sec-btn sec-btn--outline" ng-click="vm.close()">Close</button>
        </div>
    </div>
</div>
