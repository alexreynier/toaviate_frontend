<div class="sec-modal">

    <div class="sec-modal__header">
        <i class="fas fa-fingerprint sec-modal__header-icon"></i>
        <h3 class="sec-modal__title">Add a Passkey</h3>
    </div>

    <div class="sec-modal__body">
        <p class="sec-modal__text">
            A passkey lets you sign in on this device with Face ID, Touch ID or
            your device PIN — no password needed. Confirm your password, then
            follow your browser's prompt.
        </p>

        <form ng-submit="vm.submit()">
            <label class="sec-modal__label" for="passkey-add-password">Your password</label>
            <input type="password" id="passkey-add-password" class="sec-modal__input"
                   ng-model="vm.password" autocomplete="current-password" />

            <label class="sec-modal__label" for="passkey-add-label">Name this passkey (optional)</label>
            <input type="text" id="passkey-add-label" class="sec-modal__input"
                   ng-model="vm.label" placeholder="e.g. Alex's iPhone" maxlength="60" />

            <div class="sec-waiting" ng-show="vm.waiting">
                <div class="sec-spinner"></div>
                <span>Waiting for your device…</span>
            </div>

            <div class="sec-modal__footer">
                <button type="button" class="sec-btn sec-btn--outline" ng-click="vm.cancel()" ng-disabled="vm.busy">Cancel</button>
                <button type="submit" class="sec-btn sec-btn--primary" ng-disabled="vm.busy">
                    {{ vm.busy ? 'Waiting…' : 'Create passkey' }}
                </button>
            </div>
        </form>
    </div>

</div>
