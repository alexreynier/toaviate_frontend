<!-- Members hub chrome (header + tab bar). The active child renders in the
     nested ui-view below; see MembersHubController and the hub states in app.js. -->
<div class="snazzy-page mhub">

  <div class="snazzy-page__header">
    <div class="snazzy-page__header-inner">
      <div class="back-box" ui-sref="dashboard.manage_club">
        <i class="fa fa-arrow-circle-left"></i> BACK
      </div>
      <div class="snazzy-page__title">
        <h2><i class="fa" ng-class="hub.meta().icon"></i> {{ hub.meta().title }}</h2>
        <p>{{ hub.meta().subtitle }}</p>
      </div>
      <div class="snazzy-page__header-actions mhub__actions" ng-show="hub.isMembers()">
        <button class="btn members-page__add-btn" ui-sref="dashboard.manage_club.add_member">
          <i class="fa fa-user-plus"></i> Add a Member
        </button>
      </div>
    </div>
  </div>

  <div class="trk-tabs mchub-tabs mhub__tabs">
    <a class="trk-tab" ui-sref="dashboard.manage_club.members" ui-sref-active="trk-tab--active">
      <i class="fas fa-users"></i> Members
    </a>
    <a class="trk-tab" ui-sref="dashboard.manage_club.member_requests" ui-sref-active="trk-tab--active">
      <i class="fas fa-user-plus"></i> Requests
    </a>
    <a class="trk-tab" ui-sref="dashboard.manage_instructor_bookings" ui-sref-active="trk-tab--active">
      <i class="fas fa-user-tie"></i> Instructors
    </a>
    <a class="trk-tab" ui-sref="dashboard.manage_club.missing_students" ui-sref-active="trk-tab--active">
      <i class="fas fa-user-times"></i> Missing Students
    </a>
    <a class="trk-tab" ui-sref="dashboard.manage_club.records_to_file" ui-sref-active="trk-tab--active">
      <i class="fas fa-file-signature"></i> <span class="rtf-hubtab__long">Records to File</span><span class="rtf-hubtab__short">To File</span>
    </a>
  </div>

  <ui-view class="mhub__view"></ui-view>

</div>
