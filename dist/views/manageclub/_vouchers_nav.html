<!-- Shared sub-nav for the consolidated "Vouchers" admin hub.
     ng-include'd below the header on: experiences.html,
     experience_discounts.html, vouchers.html and voucher_widget.html.
     Routes/controllers are untouched — this is navigation chrome only.
     Reuses the .trk-tabs underline styling (css/trackers.css), the
     established manage_club sub-nav look; hub spacing is .mchub-tabs
     in css/manage-club-hubs.css.

     Unlike the other three admin hubs, Experiences / Discounts /
     Vouchers each have .add and .edit CHILD states that render their
     form INTO this page's ui-view. The tab bar hides itself there so it
     doesn't sit above an unrelated form. vm.state is $state (all three
     list controllers inject it); .$current.name is the LEAF state, so
     this is true only while a list view is showing. voucher_widget has
     no children but is listed so its own tab bar shows.
     All four controllers expose vm.state — no `!vm.state` fallback, which
     would wrongly show the bar on the add/edit states it must hide on. -->
<div class="trk-tabs mchub-tabs"
     ng-if="vm.state.$current.name === 'dashboard.manage_club.experiences'
         || vm.state.$current.name === 'dashboard.manage_club.experience_discounts'
         || vm.state.$current.name === 'dashboard.manage_club.vouchers'
         || vm.state.$current.name === 'dashboard.manage_club.voucher_widget'">
    <a class="trk-tab" ui-sref="dashboard.manage_club.vouchers" ui-sref-active="trk-tab--active">
        <i class="fas fa-ticket-alt"></i> Vouchers
    </a>
    <a class="trk-tab" ui-sref="dashboard.manage_club.experiences" ui-sref-active="trk-tab--active">
        <i class="fas fa-cloud"></i> Air Experiences
    </a>
    <a class="trk-tab" ui-sref="dashboard.manage_club.experience_discounts" ui-sref-active="trk-tab--active">
        <i class="fas fa-percentage"></i> Discounts
    </a>
    <a class="trk-tab" ui-sref="dashboard.manage_club.voucher_widget" ui-sref-active="trk-tab--active">
        <i class="fas fa-code"></i> Website Widget
    </a>
</div>
