<!-- A single material row (instructor manage view). Expects `m` in scope. -->
<div class="cc-item__icon cc-item__icon--material"><i class="fa" ng-class="m.file_type === 'video' ? 'fa-film' : 'fa-file-pdf'"></i></div>
<div class="cc-item__body">
  <div class="cc-item__title">
    {{ m.title }}
    <span class="cc-badge" ng-class="m.is_published ? 'cc-badge--green' : 'cc-badge--draft'">{{ m.is_published ? 'Published' : 'Draft' }}</span>
    <span class="cc-badge cc-badge--amber" ng-if="vm.materialProcessing(m)"><i class="fa fa-gear fa-spin"></i> Processing…</span>
    <span class="cc-badge cc-badge--blue" ng-if="m.file_type === 'video' && m.processing_status === 'ready'"><i class="fa fa-circle-check"></i> Ready</span>
    <span class="cc-badge" style="background:#fee2e2;color:#991b1b;" ng-if="vm.materialFailed(m)"><i class="fa fa-triangle-exclamation"></i> Failed</span>
  </div>
  <div class="cc-item__sub" ng-if="m.description">{{ m.description }}</div>
  <div class="cc-item__sub" ng-if="vm.materialFailed(m) && m.processing_error" style="color:#991b1b;">{{ m.processing_error }}</div>
  <div class="cc-item__sub">
    <span class="cc-chip"><i class="fa fa-file"></i> {{ m.original_name }}</span>
    <span class="cc-chip" ng-if="m.file_type">{{ vm.pretty(m.file_type) }}</span>
    <span class="cc-chip" ng-if="m.duration_seconds"><i class="fa fa-clock"></i> {{ m.duration_seconds }}s</span>
  </div>
  <div class="cc-item__sub" ng-if="m.engagement">
    <span class="cc-chip cc-badge--blue"><i class="fa fa-eye"></i> {{ m.engagement.opened_by || 0 }} opened</span>
    <span class="cc-chip cc-badge--green"><i class="fa fa-circle-check"></i> {{ m.engagement.completed_by || 0 }} completed</span>
  </div>
</div>
<div class="cc-item__actions">
  <button class="cc-btn" ng-class="m.is_published ? 'cc-btn--ghost' : 'cc-btn--success'" ng-click="vm.toggleMaterialPublish(m)"
          uib-tooltip="{{ m.is_published ? 'Unpublish' : 'Publish' }}">
    <i class="fa" ng-class="m.is_published ? 'fa-eye-slash' : 'fa-cloud-arrow-up'"></i> {{ m.is_published ? 'Unpublish' : 'Publish' }}
  </button>
  <button class="cc-btn cc-btn--ghost" ng-click="vm.shareMaterial(m)" uib-tooltip="Share with a student"><i class="fa fa-share-nodes"></i></button>
  <button class="cc-btn cc-btn--ghost" ng-click="vm.viewMaterialShares(m)" uib-tooltip="Who it's shared with"><i class="fa fa-user-group"></i></button>
  <button class="cc-btn cc-btn--ghost" ng-click="vm.viewMaterialAccess(m)" uib-tooltip="Access report"><i class="fa fa-chart-line"></i> Access</button>
  <button class="cc-btn cc-btn--danger" ng-click="vm.deleteMaterial(m)" uib-tooltip="Delete"><i class="fa fa-trash"></i></button>
</div>
