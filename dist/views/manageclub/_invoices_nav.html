<!-- Shared sub-nav for the consolidated "Invoices" admin hub.
     ng-include'd below the header on: all_invoices.html and payments.html.
     Routes/controllers are untouched — this is navigation chrome only.
     Reuses the .trk-tabs underline styling (css/trackers.css), the
     established manage_club sub-nav look; hub spacing is .mchub-tabs
     in css/manage-club-hubs.css.

     Both states are leaves (no child states), so unlike _vouchers_nav.html
     this bar needs no state gate. -->
<div class="trk-tabs mchub-tabs">
    <a class="trk-tab" ui-sref="dashboard.manage_club.invoices" ui-sref-active="trk-tab--active">
        <i class="fas fa-file-invoice-dollar"></i> Invoices
    </a>
    <a class="trk-tab" ui-sref="dashboard.manage_club.payments" ui-sref-active="trk-tab--active">
        <i class="fas fa-credit-card"></i> Payments
    </a>
</div>
