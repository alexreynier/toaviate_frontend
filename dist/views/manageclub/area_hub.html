<!-- Manage Club AREA HUB chrome (batch 19, 2026-11-10) — shared by the four
     abstract hub states (ops_hub / accounting_hub / admin_hub / super_admin_hub,
     AreaHubController as hub). Area bar + area tabs + the active tab's page
     row; the page itself renders unchanged in the nested ui-view below (its own
     header and tab bars stay). Zone colour per area: .achub--<area> in
     css/manage-club-hubs.css. Hidden for the non-admin exceptions (hub.showChrome). -->
<div class="achub" ng-class="'achub--' + hub.area" data-e2e="mc-area-hub" data-area="{{ hub.area }}" ng-if="hub.showChrome()">

  <div class="achub__bar">
    <a class="achub__back" ui-sref="dashboard.manage_club" data-e2e="mc-area-back">
      <i class="fa fa-arrow-circle-left"></i> <span>Back to Manage Club</span>
    </a>
    <div class="achub__name">
      <span class="achub__dot"></span>
      <i class="fa" ng-class="hub.meta.icon"></i>
      <span class="achub__title">{{ hub.meta.title }}</span>
      <span class="achub__hint">{{ hub.meta.subtitle }}</span>
    </div>
  </div>

  <div class="trk-tabs mchub-tabs achub__tabs" data-e2e="mc-area-tabs">
    <a class="trk-tab achub__tab" ng-repeat="t in hub.tabs"
       ng-href="{{ hub.tabHref(t) }}"
       ng-class="{'trk-tab--active': hub.isActiveTab(t)}"
       data-e2e="mc-area-tab" data-tab="{{ t.label }}">
      <i class="fa" ng-class="t.icon"></i> {{ t.label }}
    </a>
  </div>

  <div class="achub__pages" ng-if="hub.pages().length" data-e2e="mc-area-pages">
    <!-- no "opens in …" marks since 10 Nov: a shared page renders under the area the person entered -->
    <a class="achub__page" ng-repeat="p in hub.pages()"
       ng-href="{{ hub.href(p) }}"
       ng-class="{'achub__page--active': hub.isActivePage(p)}"
       data-e2e="mc-area-page" data-page="{{ p.label }}">
      <i class="fa" ng-class="p.icon"></i> {{ p.label }}
    </a>
  </div>

</div>
<ui-view class="achub__view"></ui-view>
