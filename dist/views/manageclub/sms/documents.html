<div class="sms-page">

  <div class="sms-page__header">
    <div class="sms-page__header-inner">
      <div class="back-box" ui-sref="dashboard.manage_club.sms">
        <i class="fa fa-arrow-circle-left"></i> BACK
      </div>
      <div class="sms-page__title">
        <h2><i class="fa fa-folder-open"></i> SMS Documents</h2>
        <p>Controlled documents and version history.</p>
      </div>
    </div>
  </div>

  <div class="sms-page__body">

    <div ng-include="'views/manageclub/sms/_nav.html'"></div>

    <div class="sms-loading" ng-if="vm.loading">
      <div class="sms-spinner"></div> Loading documents…
    </div>

    <div class="snazzy-reveal" ng-if="!vm.loading">

      <!-- Empty state -->
      <div class="sms-empty" ng-if="!vm.documents.length">
        <i class="fa fa-folder-open"></i>
        <p>No documents yet.</p>
      </div>

      <!-- Grouped by doc_type (pre-grouped in the controller as vm.documentGroups) -->
      <div ng-if="vm.documents.length">
        <div class="sms-detail__section" ng-repeat="group in vm.documentGroups">
          <div class="sms-detail__section-title">
            <i class="fa fa-folder"></i> {{ vm.pretty(group.key) }}
          </div>

          <div class="sms-pick-grid">
            <div class="sms-card" ng-repeat="d in group.items" style="margin-bottom:0;">
              <div class="sms-card__title" style="margin-bottom:10px;">{{ d.title }}</div>

              <div class="sms-table__muted" style="margin-bottom:12px;">{{ d.reference }}</div>

              <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
                <span class="sms-badge sms-badge--blue">{{ vm.pretty(d.doc_type) }}</span>
                <span class="sms-badge sms-badge--grey" ng-if="d.current_version_label">v{{ d.current_version_label }}</span>
                <span class="sms-badge sms-badge--amber" ng-if="d.requires_ack">
                  <i class="fa fa-pen"></i> Requires sign-off
                </span>
              </div>

              <div class="sms-table__muted" style="margin-top:12px; font-size:12px;" ng-if="d.updated_at">
                <i class="fa fa-clock"></i> Updated {{ d.updated_at }}
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>
