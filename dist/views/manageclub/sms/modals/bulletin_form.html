<div class="sms-pop">
  <div class="modal-header">
    <h3><i class="fa fa-bullhorn"></i> New Bulletin</h3>
  </div>

  <div class="modal-body">
    <div class="sms-form-grid">
      <div class="sms-field">
        <label>Type <span class="sms-req">*</span></label>
        <select class="sms-select" ng-model="m.bulletin.bulletin_type">
          <option ng-repeat="t in m.enums.bulletinType" value="{{t}}">{{m.pretty(t)}}</option>
        </select>
      </div>

      <div class="sms-field">
        <label>Title <span class="sms-req">*</span></label>
        <input type="text" class="sms-input" ng-model="m.bulletin.title" placeholder="Bulletin title">
      </div>

      <div class="sms-field sms-field--full">
        <label>Body <span class="sms-req">*</span></label>
        <textarea class="sms-textarea" rows="6" ng-model="m.bulletin.body" placeholder="Write the bulletin content…"></textarea>
      </div>

      <!-- validity window (sms_bulletins.valid_from / valid_until, be-alex-3e C11): e.g. "soft grass areas" for a week.
           Both optional; members see "Valid until …", and an expired bulletin needs no sign-off -->
      <div class="sms-field">
        <label for="bulletin-valid-from">Valid from <span class="sms-table__muted">(optional)</span></label>
        <input type="date" id="bulletin-valid-from" class="sms-input" ng-model="m.bulletin.valid_from_date">
      </div>

      <div class="sms-field" ng-class="{'field-error': m.validityError}">
        <label for="bulletin-valid-until">Valid until <span class="sms-table__muted">(optional)</span></label>
        <input type="date" id="bulletin-valid-until" class="sms-input" ng-model="m.bulletin.valid_until_date" ng-change="m.validityError = false">
      </div>

      <div class="sms-toggle-row sms-field--full">
        <div class="sms-toggle-row__text">Requires acknowledgement</div>
        <toggle-switch ng-model="m.bulletin.requires_ack" on-label="Yes" off-label="No"></toggle-switch>
      </div>

      <!-- sign-off due date (be-alex-3e C25 `due_date` on publish): members see "Due …" / "Overdue" -->
      <div class="sms-field" ng-if="m.bulletin.requires_ack">
        <label for="bulletin-ack-due">Sign-off due by <span class="sms-table__muted">(optional)</span></label>
        <input type="date" id="bulletin-ack-due" class="sms-input" ng-model="m.bulletin.ack_due_date">
      </div>

      <div class="sms-toggle-row sms-field--full">
        <div class="sms-toggle-row__text">Publish now</div>
        <toggle-switch ng-model="m.bulletin.publish_now" on-label="Yes" off-label="No"></toggle-switch>
      </div>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="sms-btn sms-btn--ghost" ng-click="m.cancel()" ng-disabled="m.saving">Cancel</button>
    <button type="button" class="sms-btn sms-btn--primary" ng-click="m.save()" ng-disabled="m.saving">
      <span class="sms-spinner" ng-if="m.saving"></span>
      <i class="fa fa-check" ng-if="!m.saving"></i> Save
    </button>
  </div>
</div>
