<!-- Shared SMS admin sub-navigation. ng-include'd by every admin SMS screen. -->
<div class="sms-tabs">
  <div class="sms-tab"
       ng-repeat="item in vm.nav"
       ng-class="{'sms-tab--active': vm.screen === item.screen}"
       ng-click="vm.go(item.state)">
    <i class="fa" ng-class="item.icon"></i> {{ item.label }}
  </div>
</div>
