<div class="snazzy-page">

  <!-- ── Header ── -->
  <div class="snazzy-page__header">
    <div class="snazzy-page__header-inner">
      <div class="back-box" ui-sref="dashboard.manage_club.items">
        <i class="fa fa-arrow-circle-left"></i> BACK
      </div>
      <div class="snazzy-page__title">
        <h2><i class="fa fa-box"></i> {{ vm.action == 'edit' ? 'Edit' : 'Add' }} Rental Item</h2>
        <p ng-if="vm.action == 'edit'">{{ vm.club.item.title }}</p>
        <p ng-if="vm.action != 'edit'">Create a new rental item</p>
      </div>
    </div>
  </div>

  <!-- ── Body ── -->
  <div class="snazzy-page__body">

    <div class="rental-item-form">
      <form>
        <!-- Details card -->
        <div class="rental-item-form__card">
          <div class="rental-item-form__card-header">
            <i class="fa fa-info-circle"></i> Item Details
          </div>
          <div class="rental-item-form__card-body">
            <div class="rental-item-form__row">
              <div class="rental-item-form__group rental-item-form__group--full">
                <label for="title">Title <span class="rental-item-form__required">*</span></label>
                <input type="text" class="rental-item-form__input" name="title" id="title" placeholder="e.g. Headset, Kneeboard, High-vis vest..." ng-model="vm.club.item.title" required ng-focus="vm.clearFieldError($event)" />
              </div>
            </div>
            <div class="rental-item-form__row">
              <div class="rental-item-form__group rental-item-form__group--full">
                <label for="description">Description</label>
                <input type="text" class="rental-item-form__input" name="description" id="description" placeholder="Optional description of the item" ng-model="vm.club.item.description" />
              </div>
            </div>
          </div>
        </div>

        <!-- Pricing card -->
        <div class="rental-item-form__card">
          <div class="rental-item-form__card-header">
            <i class="fa fa-pound-sign"></i> Pricing &amp; Availability
          </div>
          <div class="rental-item-form__card-body">
            <div class="rental-item-form__row">
              <div class="rental-item-form__group">
                <label for="cost">Cost <span class="rental-item-form__required">*</span></label>
                <input type="number" step="0.01" class="rental-item-form__input" name="cost" id="cost" placeholder="0.00" ng-model="vm.club.item.cost" required ng-focus="vm.clearFieldError($event)" />
              </div>
              <div class="rental-item-form__group">
                <label for="cost_schedule">Cost Schedule <span class="rental-item-form__required">*</span></label>
                <select class="rental-item-form__input" id="cost_schedule" ng-model="vm.club.item.cost_schedule" required ng-focus="vm.clearFieldError($event)">
                  <option value="" disabled selected>Please Choose</option>
                  <option value="1" ng-selected="vm.club.item.cost_schedule == 1">Per Day</option>
                  <option value="2" ng-selected="vm.club.item.cost_schedule == 2">Per Hour</option>
                  <option value="3" ng-selected="vm.club.item.cost_schedule == 3">Per Booking</option>
                </select>
              </div>
            </div>
            <div class="rental-item-form__row">
              <div class="rental-item-form__group">
                <label for="number_available">Number Available <span class="rental-item-form__required">*</span></label>
                <input type="number" class="rental-item-form__input" name="number_available" id="number_available" placeholder="e.g. 5" ng-model="vm.club.item.number_available" required ng-focus="vm.clearFieldError($event)" />
              </div>
              <div class="rental-item-form__group">
                <label for="accounting_ref">Accounting Ref</label>
                <input type="text" class="rental-item-form__input" name="accounting_ref" id="accounting_ref" placeholder="Optional" ng-model="vm.club.item.accounting_ref" />
              </div>
            </div>
          </div>
        </div>

        <!-- Action buttons -->
        <div class="snazzy-page__actions-bar">
          <button type="button" class="snazzy-page__btn snazzy-page__btn--outline" ng-click="back()">
            <i class="fa fa-arrow-left"></i> Back
          </button>
          <button type="button" class="snazzy-page__btn snazzy-page__btn--success" ng-click="save()">
            <i class="fa fa-save"></i> {{ vm.action == 'edit' ? 'Update Item' : 'Create Item' }}
          </button>
        </div>

      </form>
    </div>

  </div>

</div>
