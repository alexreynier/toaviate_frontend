<div class="modal-header">
  <h3 class="modal-title"><i class="fa fa-microchip"></i> {{ m.is_edit ? 'Edit version' : 'New tracker version' }}</h3>
  <p ng-if="m.is_edit">{{ m.form.code }}</p>
</div>
<div class="modal-body">
  <div class="trk-section">
    <div class="trk-form-grid">
      <div class="trk-field" ng-if="!m.is_edit">
        <label for="field-trk-ver-code">Code <span class="trk-req">*</span></label>
        <input id="field-trk-ver-code" class="trk-input" type="text" ng-model="m.form.code" placeholder="e.g. FOX-11B">
        <div class="trk-field__hint">Immutable once created.</div>
      </div>
      <div class="trk-field">
        <label for="field-trk-ver-name">Name <span class="trk-req">*</span></label>
        <input id="field-trk-ver-name" class="trk-input" type="text" ng-model="m.form.name">
      </div>
      <div class="trk-field">
        <label for="field-trk-ver-hw">Hardware revision</label>
        <input id="field-trk-ver-hw" class="trk-input" type="text" ng-model="m.form.hardware_revision">
      </div>
      <div class="trk-field">
        <label for="field-trk-ver-status">Status</label>
        <select id="field-trk-ver-status" class="trk-select" ng-model="m.form.status">
          <option value="active">active</option>
          <option value="discontinued">discontinued</option>
        </select>
      </div>
      <div class="trk-field">
        <label for="field-trk-ver-released">Released</label>
        <input id="field-trk-ver-released" class="trk-input" type="date" ng-model="m.form.released_at">
      </div>
      <div class="trk-field trk-field--full">
        <label for="field-trk-ver-desc">Description (shown to clubs in the shop)</label>
        <textarea id="field-trk-ver-desc" class="trk-textarea" ng-model="m.form.description"></textarea>
      </div>
      <div class="trk-field trk-field--full">
        <label for="field-trk-ver-fitting">Fitting notes (shown to maintenance orgs)</label>
        <textarea id="field-trk-ver-fitting" class="trk-textarea" ng-model="m.form.fitting_notes"></textarea>
      </div>
    </div>
  </div>

  <div class="trk-section" ng-if="!m.is_edit">
    <h5 class="trk-section-title">
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; text-transform: none; margin: 0;">
        <input type="checkbox" ng-model="m.seed_pricing" style="margin: 0;"> Set the initial pricing now
      </label>
    </h5>
    <div class="trk-form-grid" ng-if="m.seed_pricing">
      <div class="trk-field">
        <label for="field-trk-ver-unit-price">Unit price <span class="trk-req">*</span></label>
        <input id="field-trk-ver-unit-price" class="trk-input" type="number" step="0.01" min="0" ng-model="m.pricing.unit_price">
      </div>
      <div class="trk-field">
        <label for="field-trk-ver-monthly-price">Monthly price <span class="trk-req">*</span></label>
        <input id="field-trk-ver-monthly-price" class="trk-input" type="number" step="0.01" min="0" ng-model="m.pricing.monthly_price">
      </div>
      <div class="trk-field">
        <label for="field-trk-ver-shipping">Shipping price</label>
        <input id="field-trk-ver-shipping" class="trk-input" type="number" step="0.01" min="0" ng-model="m.pricing.shipping_price">
      </div>
      <div class="trk-field">
        <label for="field-trk-ver-vat">VAT rate (%)</label>
        <input id="field-trk-ver-vat" class="trk-input" type="number" step="0.1" min="0" ng-model="m.pricing.vat_rate">
      </div>
      <div class="trk-field">
        <label for="field-trk-ver-currency">Currency</label>
        <select id="field-trk-ver-currency" class="trk-select" ng-model="m.pricing.currency">
          <option value="GBP">GBP</option>
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
        </select>
      </div>
      <div class="trk-field">
        <label for="field-trk-ver-effective">Effective from</label>
        <input id="field-trk-ver-effective" class="trk-input" type="date" ng-model="m.pricing.effective_from">
        <div class="trk-field__hint">Leave blank for “immediately”.</div>
      </div>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button class="trk-btn trk-btn--ghost" ng-click="m.cancel()" ng-disabled="m.saving">Cancel</button>
  <button class="trk-btn trk-btn--primary" ng-click="m.submit()" ng-disabled="m.saving">
    <span ng-if="m.saving" class="trk-spinner trk-spinner--inline"></span>
    <i class="fa fa-check" ng-if="!m.saving"></i> {{ m.is_edit ? 'Save version' : 'Create version' }}
  </button>
</div>
