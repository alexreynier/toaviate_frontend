<div class="modal-header">
  <h3 class="modal-title"><i class="fa fa-shipping-fast"></i> Ship order</h3>
  <p>Order {{ m.order.order_number }} — the club will be emailed the tracking details and fitting packs.</p>
</div>
<div class="modal-body">
  <div class="trk-section">
    <div class="trk-form-grid">
      <div class="trk-field">
        <label for="field-trk-ship-courier">Courier <span class="trk-req">*</span></label>
        <input id="field-trk-ship-courier" class="trk-input" type="text" ng-model="m.form.courier" placeholder="e.g. Royal Mail, DPD">
      </div>
      <div class="trk-field">
        <label for="field-trk-ship-tracking">Tracking code <span class="trk-req">*</span></label>
        <input id="field-trk-ship-tracking" class="trk-input" type="text" ng-model="m.form.tracking_code">
      </div>
      <div class="trk-field trk-field--full">
        <label for="field-trk-ship-url">Tracking URL</label>
        <input id="field-trk-ship-url" class="trk-input" type="url" ng-model="m.form.tracking_url" placeholder="https://…">
      </div>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button class="trk-btn trk-btn--ghost" ng-click="m.cancel()" ng-disabled="m.saving">Cancel</button>
  <button class="trk-btn trk-btn--primary" ng-click="m.submit()" ng-disabled="m.saving">
    <span ng-if="m.saving" class="trk-spinner trk-spinner--inline"></span>
    <i class="fa fa-shipping-fast" ng-if="!m.saving"></i> Mark as shipped
  </button>
</div>
