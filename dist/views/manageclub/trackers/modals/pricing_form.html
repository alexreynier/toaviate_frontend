<div class="modal-header">
  <h3 class="modal-title"><i class="fa fa-tags"></i> {{ m.is_edit ? 'Edit scheduled price' : 'Add pricing' }}</h3>
  <p>A future “effective from” date schedules a price change; prices already in force can't be edited.</p>
</div>
<div class="modal-body">
  <div class="trk-section">
    <div class="trk-form-grid">
      <div class="trk-field">
        <label for="field-trk-price-unit">Unit price <span class="trk-req">*</span></label>
        <input id="field-trk-price-unit" class="trk-input" type="number" step="0.01" min="0" ng-model="m.form.unit_price">
      </div>
      <div class="trk-field">
        <label for="field-trk-price-monthly">Monthly price <span class="trk-req">*</span></label>
        <input id="field-trk-price-monthly" class="trk-input" type="number" step="0.01" min="0" ng-model="m.form.monthly_price">
      </div>
      <div class="trk-field">
        <label for="field-trk-price-shipping">Shipping price</label>
        <input id="field-trk-price-shipping" class="trk-input" type="number" step="0.01" min="0" ng-model="m.form.shipping_price">
      </div>
      <div class="trk-field">
        <label for="field-trk-price-vat">VAT rate (%)</label>
        <input id="field-trk-price-vat" class="trk-input" type="number" step="0.1" min="0" ng-model="m.form.vat_rate">
      </div>
      <div class="trk-field">
        <label for="field-trk-price-currency">Currency</label>
        <select id="field-trk-price-currency" class="trk-select" ng-model="m.form.currency">
          <option value="GBP">GBP</option>
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
        </select>
      </div>
      <div class="trk-field">
        <label for="field-trk-price-effective">Effective from</label>
        <input id="field-trk-price-effective" class="trk-input" type="date" ng-model="m.form.effective_from">
        <div class="trk-field__hint">Leave blank for “immediately”; a future date schedules the change.</div>
      </div>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button class="trk-btn trk-btn--ghost" ng-click="m.cancel()" ng-disabled="m.saving">Cancel</button>
  <button class="trk-btn trk-btn--primary" ng-click="m.submit()" ng-disabled="m.saving">
    <span ng-if="m.saving" class="trk-spinner trk-spinner--inline"></span>
    <i class="fa fa-check" ng-if="!m.saving"></i> Save pricing
  </button>
</div>
