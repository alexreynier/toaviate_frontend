<!-- Shared club tracker-commerce sub-navigation. ng-include'd by every club tracker screen.
     data-area (batch 19): Ops = units / activity / returns, Accounting = shop / orders / billing (item.area, trackerClubController). -->
<div class="trk-tabs">
  <div class="trk-tab"
       ng-repeat="item in vm.nav"
       ng-class="{'trk-tab--active': vm.navActive === item.screen}"
       ng-click="vm.go(item.state)"
       data-area="{{ item.area }}">
    <i class="fa" ng-class="item.icon"></i> {{ item.label }}
  </div>
</div>
