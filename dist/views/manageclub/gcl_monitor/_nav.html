<!-- Shared GoCardless-monitor sub-navigation. ng-include'd by every monitor screen. -->
<div class="trk-tabs">
  <div class="trk-tab"
       ng-repeat="item in vm.nav"
       ng-class="{'trk-tab--active': vm.screen === item.screen}"
       ng-click="vm.go(item.state)">
    <i class="fa" ng-class="item.icon"></i> {{ item.label }}
    <span class="gclm-nav-alert" ng-if="item.screen === 'overview' && vm.attention_count">{{ vm.attention_count }}</span>
  </div>
</div>
