<div class="snazzy-page">

  <!-- ── Header ── -->
  <div class="snazzy-page__header">
    <div class="snazzy-page__header-inner">
      <div class="back-box" ui-sref="dashboard.manage_club.shop_items">
        <i class="fa fa-arrow-circle-left"></i> BACK
      </div>
      <div class="snazzy-page__title">
        <h2><i class="fa fa-shopping-bag"></i> {{ vm.action == 'edit' ? 'Edit' : 'Add' }} Shop Item</h2>
        <p ng-if="vm.action == 'edit'">{{ vm.club.item.title }}</p>
        <p ng-if="vm.action != 'edit'">Create a new shop item</p>
      </div>
    </div>
  </div>

  <!-- ── Body ── -->
  <div class="snazzy-page__body">

    <div class="shop-item-form">
      <form>
        <!-- Details card -->
        <div class="shop-item-form__card">
          <div class="shop-item-form__card-header">
            <i class="fa fa-info-circle"></i> Item Details
          </div>
          <div class="shop-item-form__card-body">
            <div class="shop-item-form__row">
              <div class="shop-item-form__group shop-item-form__group--full">
                <label for="title">Title <span class="shop-item-form__required">*</span></label>
                <input type="text" class="shop-item-form__input" name="title" id="title" placeholder="e.g. Logbook, Pen, Fuel Card..." ng-model="vm.club.item.title" required ng-focus="vm.clearFieldError($event)" />
              </div>
            </div>
            <div class="shop-item-form__row">
              <div class="shop-item-form__group shop-item-form__group--full">
                <label for="description">Description</label>
                <input type="text" class="shop-item-form__input" name="description" id="description" placeholder="Optional description of the item" ng-model="vm.club.item.description" />
              </div>
            </div>
          </div>
        </div>

        <!-- Pricing card -->
        <div class="shop-item-form__card">
          <div class="shop-item-form__card-header">
            <i class="fa fa-pound-sign"></i> Pricing &amp; Tax
          </div>
          <div class="shop-item-form__card-body">
            <div class="shop-item-form__row">
              <div class="shop-item-form__group">
                <label for="price">Price <span class="shop-item-form__required">*</span></label>
                <div class="shop-item-form__hint">Inclusive of any VAT</div>
                <input type="number" step="0.01" class="shop-item-form__input" name="price" id="price" placeholder="0.00" ng-model="vm.club.item.price" required ng-focus="vm.clearFieldError($event)" />
              </div>
              <div class="shop-item-form__group">
                <label for="vat_rate">VAT Rate (%)</label>
                <div class="shop-item-form__hint">Leave blank or 0 if no VAT</div>
                <input type="number" step="0.01" class="shop-item-form__input" name="vat_rate" id="vat_rate" placeholder="e.g. 20" ng-model="vm.club.item.vat_rate" />
              </div>
            </div>
            <div class="shop-item-form__row">
              <div class="shop-item-form__group">
                <label for="accounting_ref">Accounting Ref</label>
                <input type="text" class="shop-item-form__input" name="accounting_ref" id="accounting_ref" placeholder="Optional" ng-model="vm.club.item.accounting_ref" />
              </div>
              <div class="shop-item-form__group">
                <!-- spacer for alignment -->
              </div>
            </div>
          </div>
        </div>

        <!-- Action buttons -->
        <div class="snazzy-page__actions-bar">
          <button type="button" class="snazzy-page__btn snazzy-page__btn--outline" ng-click="back()">
            <i class="fa fa-arrow-left"></i> Back
          </button>
          <button type="button" class="snazzy-page__btn snazzy-page__btn--success" ng-click="save()">
            <i class="fa fa-save"></i> {{ vm.action == 'edit' ? 'Update Item' : 'Create Item' }}
          </button>
        </div>

      </form>
    </div>

  </div>

</div>
