<div>

  <h2 class="inv-title">Next of Kin</h2>
  <p class="inv-subtitle">Please provide emergency contact details.</p>

  <!-- First Name / Last Name -->
  <div class="inv-field-row">
    <div class="inv-field" ng-class="{'inv-field--error': formErrors.nok_first_name}">
      <label class="inv-field__label">First Name <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" name="first_name" ng-model="formData.user.nok.first_name" ng-change="clearFormError('nok_first_name')" required />
      <span class="inv-field__error" ng-if="formErrors.nok_first_name">{{ formErrors.nok_first_name }}</span>
    </div>
    <div class="inv-field" ng-class="{'inv-field--error': formErrors.nok_last_name}">
      <label class="inv-field__label">Last Name <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" name="last_name" ng-model="formData.user.nok.last_name" ng-change="clearFormError('nok_last_name')" required />
      <span class="inv-field__error" ng-if="formErrors.nok_last_name">{{ formErrors.nok_last_name }}</span>
    </div>
  </div>

  <!-- Phone / Relationship -->
  <div class="inv-field-row">
    <div class="inv-field" ng-class="{'inv-field--error': formErrors.nok_phone}">
      <label class="inv-field__label">Phone Number <span class="inv-required">*</span></label>
      <input type="phone" class="inv-field__input" name="phone" ng-model="formData.user.nok.phone" ng-change="clearFormError('nok_phone')" required />
      <span class="inv-field__error" ng-if="formErrors.nok_phone">{{ formErrors.nok_phone }}</span>
    </div>
    <div class="inv-field" ng-class="{'inv-field--error': formErrors.nok_relationship}">
      <label class="inv-field__label">Relationship <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" name="relationship" ng-model="formData.user.nok.relationship" ng-change="clearFormError('nok_relationship')" required />
      <span class="inv-field__error" ng-if="formErrors.nok_relationship">{{ formErrors.nok_relationship }}</span>
    </div>
  </div>

  <!-- Email (optional) -->
  <div class="inv-field">
    <label class="inv-field__label">Email <span style="color: #999; font-weight: normal;">(optional)</span></label>
    <input type="email" class="inv-field__input" name="email" ng-model="formData.user.nok.email" />
  </div>

  <!-- Address -->
  <div class="inv-field" ng-class="{'inv-field--error': formErrors.nok_address}">
    <label class="inv-field__label">Address <span class="inv-required">*</span></label>
    <textarea class="inv-field__input" name="address" ng-model="formData.user.nok.address" ng-change="clearFormError('nok_address')" rows="3" required></textarea>
    <span class="inv-field__error" ng-if="formErrors.nok_address">{{ formErrors.nok_address }}</span>
  </div>

  <!-- Buttons -->
  <div class="inv-btn-group">
    <a class="inv-btn inv-btn--back" ng-click="setFormStep(1)" ui-sref="user_signup.your_details">Back</a>
    <button type="button" class="inv-btn inv-btn--primary" ng-click="validateNok()">Continue</button>
  </div>

</div>
