<div>

  <h2 class="inv-title">Your Medical</h2>
  <p class="inv-subtitle">Please provide your medical certificate details.</p>

  <!-- Medical Type -->
  <div class="inv-field">
    <label class="inv-field__label">Medical Type <span class="inv-required">*</span></label>
    <ui-select ng-model="medical.selected" theme="select2" ng-disabled="disabled" style="min-width: 100%;" title="What type of medical do you have?" append-to-body="true">
      <ui-select-match placeholder="Please select your medical...">
        {{ $select.selected.title }}
      </ui-select-match>
      <ui-select-choices repeat="medical in medicals.medicals | propsFilter: {title: $select.search, id: $select.search}">
        <div ng-bind-html="medical.title | highlight: $select.search"></div>
      </ui-select-choices>
    </ui-select>
  </div>

  <!-- Certificate Number -->
  <div class="inv-field">
    <label class="inv-field__label">Medical Certificate Number</label>
    <input type="text" class="inv-field__input" name="medical" ng-model="formData.medical.medical_certificate_number" />
  </div>

  <!-- Class 1 SPCOC / Class 1 Other -->
  <div class="inv-field-row">
    <div class="inv-field">
      <label class="inv-field__label">Class 1 Single Pilot Commercial Ops Expiry</label>
      <input type="date" class="inv-field__input" name="medical_exp_1" ng-model="formData.medical.class_1_spcoc" />
    </div>
    <div class="inv-field">
      <label class="inv-field__label">Class 1 Other Operations Expiry</label>
      <input type="date" class="inv-field__input" name="medical_exp_2" ng-model="formData.medical.class_1_other" />
    </div>
  </div>

  <!-- Class 2 / LAPL -->
  <div class="inv-field-row">
    <div class="inv-field">
      <label class="inv-field__label">Class 2 Expiry Date</label>
      <input type="date" class="inv-field__input" name="medical_exp_3" ng-model="formData.medical.class_2" />
    </div>
    <div class="inv-field">
      <label class="inv-field__label">LAPL Expiry Date</label>
      <input type="date" class="inv-field__input" name="medical_exp_4" ng-model="formData.medical.class_lapl" />
    </div>
  </div>

  <!-- ECG / Audiogram -->
  <div class="inv-field-row">
    <div class="inv-field">
      <label class="inv-field__label">Last ECG Date</label>
      <input type="date" class="inv-field__input" name="ecg" ng-model="formData.medical.ecg_date" />
    </div>
    <div class="inv-field">
      <label class="inv-field__label">Last Audiogram Date</label>
      <input type="date" class="inv-field__input" name="audiogram" ng-model="formData.medical.audiogram_date" />
    </div>
  </div>

  <!-- Examination Date -->
  <div class="inv-field">
    <label class="inv-field__label">Examination Date</label>
    <input type="date" class="inv-field__input" name="exam_date" ng-model="formData.medical.exam_date" />
  </div>

  <!-- Upload -->
  <div class="inv-field">
    <label class="inv-field__label">Upload Your Medical Certificate</label>
    <input type="file" class="inv-field__input" name="medical" ng-model="formData.medical" />
  </div>

  <!-- Buttons -->
  <div class="inv-btn-group">
    <a class="inv-btn inv-btn--back" ng-click="checkValid('user_signup.your_license')" one-ui-sref="user_signup.your_license">Back</a>
    <a class="inv-btn inv-btn--primary" one-ui-sref="user_signup.your_tnc" ng-click="checkValid('user_signup.tnc')">Continue</a>
  </div>

</div>
