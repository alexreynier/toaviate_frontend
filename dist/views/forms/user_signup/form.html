<div class="inv-page">

  <!-- Header -->
  <div class="inv-header">
    <img src="images/main_logo.png" alt="ToAviate" class="inv-header__logo" />
    <ul class="inv-header__links">
      <li><a href="https://toaviate.com">Main Website</a></li>
      <li><a ui-sref="login">Login</a></li>
    </ul>
  </div>

  <!-- Card -->
  <div class="inv-card">

    <!-- Progress stepper -->
    <div class="inv-stepper">
      <div class="inv-step" ng-class="{'active': formStep === 1, 'completed': formStep > 1}">
        <div class="inv-step__dot"><span ng-if="formStep <= 1">1</span><i ng-if="formStep > 1" class="fa fa-check"></i></div>
        <div class="inv-step__label">Details</div>
      </div>
      <div class="inv-step" ng-class="{'active': formStep === 2, 'completed': formStep > 2}">
        <div class="inv-step__dot"><span ng-if="formStep <= 2">2</span><i ng-if="formStep > 2" class="fa fa-check"></i></div>
        <div class="inv-step__label">Next of Kin</div>
      </div>
      <div class="inv-step" ng-class="{'active': formStep === 3, 'completed': formStep > 3}">
        <div class="inv-step__dot"><span ng-if="formStep <= 3">3</span><i ng-if="formStep > 3" class="fa fa-check"></i></div>
        <div class="inv-step__label">Club</div>
      </div>
      <div class="inv-step" ng-class="{'active': formStep === 4, 'completed': formStep > 4}">
        <div class="inv-step__dot"><span ng-if="formStep <= 4">4</span><i ng-if="formStep > 4" class="fa fa-check"></i></div>
        <div class="inv-step__label">Licence</div>
      </div>
      <div class="inv-step" ng-class="{'active': formStep === 5, 'completed': formStep > 5}">
        <div class="inv-step__dot"><span ng-if="formStep <= 5">5</span><i ng-if="formStep > 5" class="fa fa-check"></i></div>
        <div class="inv-step__label">Terms</div>
      </div>
    </div>

    <!-- Form content -->
    <form id="signup-form" ng-submit="processForm()" novalidate>
      <div class="inv-content" ui-view></div>
    </form>

  </div>
</div>
