<div>
  <h2 class="inv-title">Software Agreement</h2>
  <p class="inv-subtitle">Please confirm you accept the ToAviate software terms to continue.</p>

  <!-- Software T&C -->
  <label class="inv-agreement" ng-class="{'inv-agreement--checked': formData.tnc, 'inv-agreement--error': invErrors.tnc}">
    <input type="checkbox" ng-model="formData.tnc" ng-change="clearInvError('tnc')">
    <div class="inv-agreement__check"></div>
    <div class="inv-agreement__text">
      I have read, understand and agree to the full <a ng-click="downloadClubDocument('2av8_terms'); $event.preventDefault();">Terms &amp; Conditions</a> and <a ng-click="downloadClubDocument('2av8_privacy'); $event.preventDefault();">Privacy Policy</a> of the software.
    </div>
  </label>

  <div class="inv-btn-group">
    <a class="inv-btn inv-btn--primary" ng-click="validateTnc()">
      <i class="fa fa-check-circle"></i> Sign Up Now
    </a>
  </div>
</div>
