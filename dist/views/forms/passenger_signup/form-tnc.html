<div>

  <h2 class="inv-title">Terms &amp; Conditions</h2>

  <div class="inv-agreement" ng-class="{'inv-agreement--checked': formData.club_tnc}" ng-click="formData.club_tnc = !formData.club_tnc">
    <input type="checkbox" class="inv-agreement__check" ng-model="formData.club_tnc" value="tnc" required ng-click="$event.stopPropagation()" />
    <span class="inv-agreement__text">I have read, understand and agree to the full <a ng-click="$event.stopPropagation(); downloadClubDocument()">terms and conditions</a> and <a ng-click="$event.stopPropagation(); downloadClubDocument()">terms of service</a> of the flight organisation.</span>
  </div>

  <div class="inv-agreement" ng-class="{'inv-agreement--checked': formData.tnc}" ng-click="formData.tnc = !formData.tnc">
    <input type="checkbox" class="inv-agreement__check" ng-model="formData.tnc" value="tnc" required ng-click="$event.stopPropagation()" />
    <span class="inv-agreement__text">I have read, understand and agree to the full <a ng-click="$event.stopPropagation(); downloadClubDocument('2av8_terms')">Terms &amp; Conditions</a> and <a ng-click="$event.stopPropagation(); downloadClubDocument('2av8_privacy')">Privacy Policy</a> of the software.</span>
  </div>

  <div class="inv-error-banner" ng-if="submitError">
    <i class="fa fa-exclamation-circle"></i>
    <span>{{ submitError }}</span>
  </div>

  <div class="inv-btn-group">
    <button class="inv-btn inv-btn--back" ng-click="$event.stopPropagation();" ui-sref="passenger_signup.next_of_kin" ng-disabled="submitting">Back</button>
    <button class="inv-btn inv-btn--success" ng-click="submit_passenger()" ng-disabled="submitting">
      <span ng-if="!submitting">Save &amp; Go Flying!</span>
      <span ng-if="submitting"><i class="fa fa-spinner fa-spin"></i> Submitting&hellip;</span>
    </button>
  </div>

</div>
