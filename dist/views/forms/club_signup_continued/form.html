<div class="inv-page">

  <!-- Header -->
  <div class="inv-header">
    <img src="images/main_logo.png" alt="ToAviate" class="inv-header__logo" />
    <ul class="inv-header__links">
      <li><a href="https://toaviate.com">Main Website</a></li>
      <li><a ui-sref="login">Login</a></li>
    </ul>
  </div>

  <!-- Card -->
  <div class="inv-card">

    <!-- Progress stepper -->
    <div class="inv-stepper">
      <div class="inv-step" ng-class="{'active': formStep === 5, 'completed': formStep > 5}">
        <div class="inv-step__dot"><span ng-if="formStep <= 5">5</span><i ng-if="formStep > 5" class="fa fa-check"></i></div>
        <div class="inv-step__label">Verify</div>
      </div>
      <div class="inv-step" ng-class="{'active': formStep === 6, 'completed': formStep > 6}">
        <div class="inv-step__dot"><span ng-if="formStep <= 6">6</span><i ng-if="formStep > 6" class="fa fa-check"></i></div>
        <div class="inv-step__label">Payments</div>
      </div>
      <div class="inv-step" ng-class="{'active': formStep === 7, 'completed': formStep > 7}">
        <div class="inv-step__dot"><span ng-if="formStep <= 7">7</span><i ng-if="formStep > 7" class="fa fa-check"></i></div>
        <div class="inv-step__label">Confirm</div>
      </div>
      <div class="inv-step" ng-class="{'active': formStep === 8, 'completed': formStep > 8}">
        <div class="inv-step__dot"><span ng-if="formStep <= 8">8</span><i ng-if="formStep > 8" class="fa fa-check"></i></div>
        <div class="inv-step__label">Complete</div>
      </div>
    </div>

    <!-- Form content -->
    <form id="signup-form" ng-submit="processForm()" novalidate>
      <div class="inv-content" ui-view></div>
    </form>

  </div>
</div>
