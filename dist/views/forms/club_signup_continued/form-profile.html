<div>
  <h2 class="inv-title">Your Profile</h2>
  <p class="inv-subtitle">Tell us about yourself. All fields marked with <span class="inv-required">*</span> are required.</p>

  <!-- Name row -->
  <div class="inv-field-row">
    <div class="inv-field" ng-class="{'inv-field--error': formErrors.first_name}">
      <label class="inv-field__label">First Name <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" ng-model="formData.user.first_name" placeholder="John" ng-change="clearFormError('first_name')" required>
      <div class="inv-field__error">First name is required</div>
    </div>
    <div class="inv-field" ng-class="{'inv-field--error': formErrors.last_name}">
      <label class="inv-field__label">Last Name <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" ng-model="formData.user.last_name" placeholder="Smith" ng-change="clearFormError('last_name')" required>
      <div class="inv-field__error">Last name is required</div>
    </div>
  </div>

  <!-- Phone -->
  <div class="inv-field" ng-class="{'inv-field--error': formErrors.phone}">
    <label class="inv-field__label">Mobile No. <span class="inv-required">*</span></label>
    <input type="tel" class="inv-field__input" ng-model="formData.user.phone" placeholder="07700 900000" ng-change="clearFormError('phone')" required>
    <div class="inv-field__error">A mobile number is required</div>
  </div>

  <div class="inv-divider"></div>

  <!-- Email -->
  <div class="inv-field" ng-class="{'inv-field--error': formErrors.email}">
    <label class="inv-field__label">Email Address <span class="inv-required">*</span></label>
    <input type="email" class="inv-field__input" ng-model="formData.user.email" placeholder="john@example.com" ng-change="clearFormError('email')" required>
    <div class="inv-field__error">A valid email address is required</div>
  </div>

  <div class="inv-divider"></div>

  <!-- Password -->
  <div class="inv-field" ng-class="{'inv-field--error': formErrors.password}">
    <label class="inv-field__label">Password <span class="inv-required">*</span></label>
    <input type="password" class="inv-field__input" ng-model="formData.user.password" placeholder="Minimum 8 characters" ng-change="clearFormError('password')" required>
    <div class="inv-field__hint" ng-if="!formErrors.password">Must be at least 8 characters long</div>
    <div class="inv-field__error">Password must be at least 8 characters</div>
  </div>

  <div class="inv-field" ng-class="{'inv-field--error': formErrors.password2}">
    <label class="inv-field__label">Confirm Password <span class="inv-required">*</span></label>
    <input type="password" class="inv-field__input" ng-model="formData.user.password2" placeholder="Re-enter your password" ng-change="clearFormError('password2')" required>
    <div class="inv-field__error">Passwords do not match</div>
  </div>

  <!-- Buttons -->
  <div class="inv-btn-group">
    <a class="inv-btn inv-btn--primary" one-ui-sref="club_signup.my_club" ng-click="validateProfile(); $event.stopPropagation();">
      Next Step <i class="fa fa-arrow-right"></i>
    </a>
  </div>
</div>
