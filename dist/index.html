   <script src="https://js.stripe.com/clover/stripe.js" async></script>


    <script src="js/770cbe86.libs.min.js"></script>

    <!-- Chart.js (CDN) — MUST stay outside the build block. usemin concatenates the
         local libs in the block above into js/libs.min.js and replaces the whole block
         with that single bundle tag, silently dropping any external/CDN <script>. Inside
         the block this tag vanished from dist/index.html → window.Chart undefined in prod
         → blank charts (statistics dashboard + flight-replay height profile). Same reason
         PDF.js lives outside the block below. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- PDF.js for PDF page rendering/selection (outside build block so it survives Grunt) -->
    <!-- In dev: loads from libs/js/; Grunt copies both files to dist/js/ for production -->
    <script src="js/pdf.min.js"></script>
    <script>
      if (typeof pdfjsLib !== 'undefined') {
        // Derive worker path from wherever pdf.min.js was loaded
        // (libs/js/ in local dev, /js/ after Grunt build)
        var pdfScript = document.querySelector('script[src*="pdf.min.js"]');
        pdfjsLib.GlobalWorkerOptions.workerSrc = pdfScript
          ? pdfScript.src.replace('pdf.min.js', 'pdf.worker.min.js')
          : '/js/pdf.worker.min.js';
      }
    </script>




    <script src="js/013d2d98.app.min.js"></script>

 
    <script src="js/edac16bc.services.min.js"></script>



    <script src="js/50a2c8c8.controllers.min.js"></script>

    <script src="js/e43a75a0.directives.min.js"></script>

<!--     <script src="libs/js/angular-timepicker.js"></script>
 -->

    <!-- Session-expired freeze: set by the HTTP interceptor's one-shot
         logout. Blurs and blocks the whole app (privacy on shared club
         machines) until whoever comes back acknowledges it. LAST in the
         body on purpose: the fixed header's z-index clamps to the int32
         max, so only a later stacking context at the same value can paint
         over it. -->
    <div class="session-freeze" ng-if="sessionFrozen">
        <div class="session-freeze__card">
            <i class="fas fa-lock session-freeze__icon"></i>
            <h3 class="session-freeze__title">You've been logged out</h3>
            <p class="session-freeze__text">
                Your session expired while you were away, so the screen has
                been hidden. Sign back in to pick up right where you left off.
            </p>
            <button type="button" class="sec-btn sec-btn--primary session-freeze__btn" ng-click="sessionUnfreeze()">
                <i class="fas fa-sign-in-alt"></i> Log back in
            </button>
        </div>
    </div>

    <!-- Idle privacy blur: after a while with no activity the screen is
         hidden (nothing is logged out). Clicking through probes the session:
         still valid → unblur; timed out → the probe's 401 swaps this for the
         logged-out overlay above. -->
    <div class="session-freeze session-freeze--idle" ng-if="idleBlurred && !sessionFrozen" ng-click="idleWake()">
        <div class="session-freeze__card">
            <i class="fas fa-eye-slash session-freeze__icon"></i>
            <h3 class="session-freeze__title">Screen hidden</h3>
            <p class="session-freeze__text">
                You've been away for a while, so the screen has been hidden
                for privacy. Click anywhere to continue.
            </p>
            <button type="button" class="sec-btn sec-btn--primary session-freeze__btn" ng-disabled="idleChecking">
                <i class="fas" ng-class="idleChecking ? 'fa-circle-notch fa-spin' : 'fa-unlock'"></i>
                {{ idleChecking ? 'Checking your session…' : 'Continue' }}
            </button>
        </div>
    </div>

</body>
</html>
