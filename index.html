    <!-- Chart.js (CDN) — MUST stay outside the build block. usemin concatenates the
         local libs in the block above into js/libs.min.js and replaces the whole block
         with that single bundle tag, silently dropping any external/CDN <script>. Inside
         the block this tag vanished from dist/index.html → window.Chart undefined in prod
         → blank charts (statistics dashboard + flight-replay height profile). Same reason
         PDF.js lives outside the block below. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- PDF.js for PDF page rendering/selection (outside build block so it survives Grunt) -->
    <!-- In dev: loads from libs/js/; Grunt copies both files to dist/js/ for production -->
    <script src="libs/js/pdf.min.js"></script>
    <script>
      if (typeof pdfjsLib !== 'undefined') {
        // Derive worker path from wherever pdf.min.js was loaded
        // (libs/js/ in local dev, /js/ after Grunt build)
        var pdfScript = document.querySelector('script[src*="pdf.min.js"]');
        pdfjsLib.GlobalWorkerOptions.workerSrc = pdfScript
          ? pdfScript.src.replace('pdf.min.js', 'pdf.worker.min.js')
          : '/js/pdf.worker.min.js';
      }
    </script>
