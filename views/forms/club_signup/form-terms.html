<div>
    <h3 class="inv-title">Terms &amp; Conditions</h3>
    <p class="inv-subtitle">Please read carefully our terms and conditions before proceeding.</p>

    <div class="inv-agreement">
        <input type="checkbox" class="inv-agreement__check" ng-model="formData.tnc" value="tnc" required>
        <span class="inv-agreement__text">
            I have read, understand and agree to the full
            <a ng-click="downloadClubDocument('2av8_terms')">Terms &amp; Conditions</a> and
            <a ng-click="downloadClubDocument('2av8_privacy')">Privacy Policy</a> of the software.
        </span>
    </div>

    <div class="inv-btn-group">
        <a ui-sref="club_signup.my_club" ng-click="setFormStep(2)" class="inv-btn inv-btn--secondary">Back</a>
        <a ng-click="validateTerms()" class="inv-btn inv-btn--primary">I Agree to the ToAviate Terms &amp; Conditions</a>
    </div>
</div>
