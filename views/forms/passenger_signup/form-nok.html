<div>

  <h2 class="inv-title">Next of Kin</h2>
  <p class="inv-subtitle">Emergency contact details</p>

  <div class="inv-field-row">
    <div class="inv-field" ng-class="{'inv-field--error': formErrors.first_name}">
      <label class="inv-field__label">First Name <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" ng-model="formData.nok.first_name" ng-change="clearFormError('first_name')" required />
      <span class="inv-field__error" ng-if="formErrors.first_name">{{ formErrors.first_name }}</span>
    </div>
    <div class="inv-field" ng-class="{'inv-field--error': formErrors.last_name}">
      <label class="inv-field__label">Last Name <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" ng-model="formData.nok.last_name" ng-change="clearFormError('last_name')" required />
      <span class="inv-field__error" ng-if="formErrors.last_name">{{ formErrors.last_name }}</span>
    </div>
  </div>

  <div class="inv-field-row">
    <div class="inv-field" ng-class="{'inv-field--error': formErrors.phone_number}">
      <label class="inv-field__label">Phone Number <span class="inv-required">*</span></label>
      <input type="phone" class="inv-field__input" ng-model="formData.nok.phone_number" ng-change="clearFormError('phone_number')" required />
      <span class="inv-field__error" ng-if="formErrors.phone_number">{{ formErrors.phone_number }}</span>
    </div>
    <div class="inv-field" ng-class="{'inv-field--error': formErrors.relationship}">
      <label class="inv-field__label">Relationship <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" ng-model="formData.nok.relationship" ng-change="clearFormError('relationship')" required />
      <span class="inv-field__error" ng-if="formErrors.relationship">{{ formErrors.relationship }}</span>
    </div>
  </div>

  <div class="inv-field" ng-class="{'inv-field--error': formErrors.email_address}">
    <label class="inv-field__label">Email</label>
    <input type="email" class="inv-field__input" ng-model="formData.nok.email_address" ng-change="clearFormError('email_address')" required />
    <span class="inv-field__error" ng-if="formErrors.email_address">{{ formErrors.email_address }}</span>
  </div>

  <div class="inv-field" ng-class="{'inv-field--error': formErrors.address}">
    <label class="inv-field__label">Address</label>
    <address-lookup placeholder="Start typing their address…"
                    on-select="formData.nok.address = address.formatted || address.line1; clearFormError('address')"></address-lookup>
    <textarea class="inv-field__input" ng-model="formData.nok.address" ng-change="clearFormError('address')" required></textarea>
    <span class="inv-field__error" ng-if="formErrors.address">{{ formErrors.address }}</span>
  </div>

  <div class="inv-btn-group">
    <button class="inv-btn inv-btn--back" ng-click="$event.stopPropagation();" ui-sref="passenger_signup.your_profile">Back</button>
    <button class="inv-btn inv-btn--primary" ng-click="validateNok(); $event.stopPropagation();">Next Section</button>
  </div>

</div>
