<div>

  <h2 class="inv-title">Welcome Back</h2>
  <p class="inv-subtitle">Please log in with your existing account to continue.</p>

  <div class="inv-field" ng-class="{'inv-field--error': formErrors.email}">
    <label class="inv-field__label">Email Address <span class="inv-required">*</span></label>
    <input type="email" class="inv-field__input" ng-model="formData.passenger.login.email" ng-change="clearFormError('email')" required />
    <span class="inv-field__error" ng-if="formErrors.email">{{ formErrors.email }}</span>
  </div>

  <div class="inv-field" ng-class="{'inv-field--error': formErrors.password}">
    <label class="inv-field__label">Password <span class="inv-required">*</span></label>
    <input type="password" class="inv-field__input" ng-model="formData.passenger.login.password" ng-change="clearFormError('password')" required />
    <span class="inv-field__error" ng-if="formErrors.password">{{ formErrors.password }}</span>
  </div>

  <div class="inv-btn-group">
    <button class="inv-btn inv-btn--primary" ng-click="login_passenger(); $event.stopPropagation();">Login</button>
  </div>

  <div class="inv-info" ng-if="passenger.login.success.details">
    <p>Welcome back, please ensure that your details are up to date:</p>
    <p>{{ passenger.login.success.details }}</p>
  </div>

  <div class="inv-btn-group">
    <button class="inv-btn inv-btn--back" ui-sref="passenger_signup.check">Back</button>
  </div>

</div>
