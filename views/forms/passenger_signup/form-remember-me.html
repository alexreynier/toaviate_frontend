<div>

  <h2 class="inv-title">Create a Password</h2>
  <p class="inv-subtitle">Set a password so you can log in quickly in the future. All you will need is your email and password to get started next time.</p>

  <div class="inv-field" ng-class="{'inv-field--error': formErrors.password}">
    <label class="inv-field__label">Password <span class="inv-required">*</span></label>
    <input type="password" class="inv-field__input" ng-model="formData.password" ng-change="clearFormError('password')" required />
    <span class="inv-field__error" ng-if="formErrors.password">{{ formErrors.password }}</span>
  </div>

  <div class="inv-field" ng-class="{'inv-field--error': formErrors.password2}">
    <label class="inv-field__label">Confirm Password <span class="inv-required">*</span></label>
    <input type="password" class="inv-field__input" ng-model="formData.password2" ng-change="clearFormError('password2')" required />
    <span class="inv-field__error" ng-if="formErrors.password2">{{ formErrors.password2 }}</span>
  </div>

  <div class="inv-btn-group">
    <button class="inv-btn inv-btn--primary" one-ui-sref="passenger_signup.tnc" ng-click="submit_button_data(); checkValid()">Terms &amp; Conditions</button>
  </div>

</div>
