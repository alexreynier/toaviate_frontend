<div>

  <h2 class="inv-title">Membership Type</h2>
  <p class="inv-subtitle">Select the membership type that applies to you.</p>

  <!-- Membership select -->
  <div class="inv-field">
    <label class="inv-field__label">I am…</label>
    <select name="membership_type" class="inv-field__input" value="new">
      <option value="new">wishing to join</option>
      <option ng-repeat="membership in memberships.memberships" value="{{ membership.id }}">already a full {{ membership.title }} holder of</option>
      <option value="instructor">already an instructor at</option>
      <option value="administrator">already an administrator of</option>
    </select>
    <span class="inv-field__hint">…the club</span>
  </div>

  <!-- Buttons -->
  <div class="inv-btn-group">
    <a class="inv-btn inv-btn--back" ng-click="checkValid('user_signup.your_club_confirmation')" one-ui-sref="user_signup.your_club_confirmation">Back</a>
    <a class="inv-btn inv-btn--primary" one-ui-sref="user_signup.your_license_check" ng-click="checkValid()">Continue</a>
  </div>

</div>
