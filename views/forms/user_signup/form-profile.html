<div>

  <h2 class="inv-title">Your Details</h2>
  <p class="inv-subtitle">Please provide your personal information to create your account.</p>

  <!-- First Name / Last Name -->
  <div class="inv-field-row">
    <div class="inv-field" ng-class="{'inv-field--error': formErrors.first_name}">
      <label class="inv-field__label">First Name <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" name="first_name" ng-model="formData.user.first_name" ng-change="clearFormError('first_name')" required />
      <span class="inv-field__error" ng-if="formErrors.first_name">{{ formErrors.first_name }}</span>
    </div>
    <div class="inv-field" ng-class="{'inv-field--error': formErrors.last_name}">
      <label class="inv-field__label">Last Name <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" name="last_name" ng-model="formData.user.last_name" ng-change="clearFormError('last_name')" required />
      <span class="inv-field__error" ng-if="formErrors.last_name">{{ formErrors.last_name }}</span>
    </div>
  </div>

  <!-- Date of Birth -->
  <div class="inv-field" ng-class="{'inv-field--error': formErrors.dob}">
    <label class="inv-field__label">Date of Birth <span class="inv-required">*</span></label>
    <input type="date" class="inv-field__input" name="dob" ng-model="formData.user.dob" ng-change="clearFormError('dob')" required />
    <span class="inv-field__error" ng-if="formErrors.dob">{{ formErrors.dob }}</span>
  </div>

  <!-- Email -->
  <div class="inv-field" ng-class="{'inv-field--error': formErrors.email}">
    <label class="inv-field__label">Email <span class="inv-required">*</span></label>
    <input type="email" class="inv-field__input" name="email" ng-model="formData.user.email" ng-change="clearFormError('email')" required />
    <span class="inv-field__error" ng-if="formErrors.email">{{ formErrors.email }}</span>
  </div>

  <!-- Password -->
  <div class="inv-field" ng-class="{'inv-field--error': formErrors.password}">
    <label class="inv-field__label">Password <span class="inv-required">*</span></label>
    <input type="password" class="inv-field__input" name="password" ng-model="formData.user.password" ng-change="clearFormError('password')" required />
    <span class="inv-field__hint">Must be at least 8 characters long.</span>
    <span class="inv-field__error" ng-if="formErrors.password">{{ formErrors.password }}</span>
  </div>

  <!-- Confirm Password -->
  <div class="inv-field" ng-class="{'inv-field--error': formErrors.password2}">
    <label class="inv-field__label">Confirm Password <span class="inv-required">*</span></label>
    <input type="password" class="inv-field__input" name="password2" ng-model="formData.user.password2" ng-change="clearFormError('password2')" required />
    <span class="inv-field__error" ng-if="formErrors.password2">{{ formErrors.password2 }}</span>
  </div>

  <!-- Submit -->
  <div class="inv-btn-group">
    <button type="button" class="inv-btn inv-btn--primary" ng-click="validateProfile()">Continue</button>
  </div>

</div>
