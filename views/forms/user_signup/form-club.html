<div>

  <h2 class="inv-title">Select Your Club</h2>
  <p class="inv-subtitle">Search for and select the flying club you wish to join.</p>

  <!-- Club select -->
  <div class="inv-field" ng-class="{'inv-field--error': formErrors.club}">
    <label class="inv-field__label">Club <span class="inv-required">*</span></label>
    <ui-select ng-model="formData.club" theme="select2" ng-disabled="disabled" style="min-width: 100%;" title="Type in your club's name" append-to-body="true">
      <ui-select-match placeholder="Please select your club...">
        {{ $select.selected.title }}
      </ui-select-match>
      <ui-select-choices repeat="club in clubs.clubs | propsFilter: {title: $select.search, id: $select.search}">
        <div ng-bind-html="club.title | highlight: $select.search"></div>
      </ui-select-choices>
    </ui-select>
    <span class="inv-field__error" ng-if="formErrors.club">{{ formErrors.club }}</span>
  </div>

  <!-- Buttons -->
  <div class="inv-btn-group">
    <a class="inv-btn inv-btn--back" ng-click="setFormStep(2)" ui-sref="user_signup.next_of_kin">Back</a>
    <a class="inv-btn inv-btn--primary" one-ui-sref="user_signup.your_club_confirmation" ng-click="checkValid()">Continue</a>
  </div>

</div>
