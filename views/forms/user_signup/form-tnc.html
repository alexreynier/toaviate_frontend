<div>

  <h2 class="inv-title">Terms &amp; Conditions</h2>

  <!-- Agreement checkbox -->
  <div class="inv-agreement" ng-class="{'inv-agreement--checked': formData.tnc}">
    <label class="inv-agreement__check">
      <input type="checkbox" ng-model="formData.tnc" value="tnc" required />
    </label>
    <span class="inv-agreement__text">
      I have read, understand and agree to the full
      <a ng-click="downloadClubDocument('2av8_terms')">Terms &amp; Conditions</a> and
      <a ng-click="downloadClubDocument('2av8_privacy')">Privacy Policy</a> of the software.
    </span>
  </div>

  <!-- Buttons -->
  <div class="inv-btn-group">
    <a class="inv-btn inv-btn--back" ng-click="setFormStep(4)" ui-sref="user_signup.your_license_check">Back</a>
    <a class="inv-btn inv-btn--success" one-ui-sref="verify_account" ng-click="checkValid(); $event.stopPropagation();" ng-disabled="!formData.tnc">SIGN UP NOW</a>
  </div>

</div>
