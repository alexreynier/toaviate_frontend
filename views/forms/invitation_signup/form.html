<div class="inv-page">

  <!-- ── Header ── -->
  <div class="inv-header">
    <img src="images/main_logo.png" alt="ToAviate" class="inv-header__logo" />
    <ul class="inv-header__links">
      <li><a href="https://toaviate.com">Main Website</a></li>
      <li><a ui-sref="login">Login</a></li>
    </ul>
  </div>

  <!-- ── Card ── -->
  <div class="inv-card">

    <!-- ── Progress stepper ── -->
    <div class="inv-stepper">
      <div class="inv-step" ng-class="{'active': invStep === 1, 'completed': invStep > 1}">
        <div class="inv-step__dot"><span ng-if="invStep <= 1">1</span><i ng-if="invStep > 1" class="fa fa-check"></i></div>
        <div class="inv-step__label">Welcome</div>
      </div>
      <div class="inv-step" ng-class="{'active': invStep === 2, 'completed': invStep > 2}">
        <div class="inv-step__dot"><span ng-if="invStep <= 2">2</span><i ng-if="invStep > 2" class="fa fa-check"></i></div>
        <div class="inv-step__label">Details</div>
      </div>
      <div class="inv-step" ng-class="{'active': invStep === 3, 'completed': invStep > 3}">
        <div class="inv-step__dot"><span ng-if="invStep <= 3">3</span><i ng-if="invStep > 3" class="fa fa-check"></i></div>
        <div class="inv-step__label">Next of Kin</div>
      </div>
      <div class="inv-step" ng-class="{'active': invStep === 4, 'completed': invStep > 4}">
        <div class="inv-step__dot"><span ng-if="invStep <= 4">4</span><i ng-if="invStep > 4" class="fa fa-check"></i></div>
        <div class="inv-step__label">Terms</div>
      </div>
      <div class="inv-step" ng-class="{'active': invStep === 5, 'completed': invStep > 5}">
        <div class="inv-step__dot"><span ng-if="invStep <= 5">5</span><i ng-if="invStep > 5" class="fa fa-check"></i></div>
        <div class="inv-step__label">Payment</div>
      </div>
      <div class="inv-step" ng-class="{'active': invStep === 6, 'completed': invStep > 6}">
        <div class="inv-step__dot"><span ng-if="invStep <= 6">6</span><i ng-if="invStep > 6" class="fa fa-check"></i></div>
        <div class="inv-step__label">Verify</div>
      </div>
    </div>

    <!-- ── Form content ── -->
    <form id="signup-form" ng-submit="processForm()" novalidate>
      <div class="inv-content" ui-view></div>
    </form>

  </div>
</div>
