<div>
  <h2 class="inv-title">Next of Kin</h2>
  <p class="inv-subtitle">For safety reasons, we need details of your emergency contact.</p>

  <!-- Name row -->
  <div class="inv-field-row">
    <div class="inv-field" ng-class="{'inv-field--error': invErrors.nok_first_name}">
      <label class="inv-field__label">First Name <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" ng-model="formData.nok.first_name" placeholder="Jane" ng-change="clearInvError('nok_first_name')" required>
      <div class="inv-field__error">First name is required</div>
    </div>
    <div class="inv-field" ng-class="{'inv-field--error': invErrors.nok_last_name}">
      <label class="inv-field__label">Last Name <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" ng-model="formData.nok.last_name" placeholder="Smith" ng-change="clearInvError('nok_last_name')" required>
      <div class="inv-field__error">Last name is required</div>
    </div>
  </div>

  <!-- Phone + Relationship row -->
  <div class="inv-field-row">
    <div class="inv-field" ng-class="{'inv-field--error': invErrors.nok_phone}">
      <label class="inv-field__label">Phone Number <span class="inv-required">*</span></label>
      <input type="tel" class="inv-field__input" ng-model="formData.nok.phone_number" placeholder="07700 900000" ng-change="clearInvError('nok_phone')" required>
      <div class="inv-field__error">Phone number is required</div>
    </div>
    <div class="inv-field" ng-class="{'inv-field--error': invErrors.nok_relationship}">
      <label class="inv-field__label">Relationship <span class="inv-required">*</span></label>
      <input type="text" class="inv-field__input" ng-model="formData.nok.relationship" placeholder="e.g. Spouse, Parent" ng-change="clearInvError('nok_relationship')" required>
      <div class="inv-field__error">Relationship is required</div>
    </div>
  </div>

  <!-- Email (optional) -->
  <div class="inv-field">
    <label class="inv-field__label">Email Address <span style="color:#94a3b8;font-weight:400;">(optional)</span></label>
    <input type="email" class="inv-field__input" ng-model="formData.nok.email_address" placeholder="jane@example.com">
  </div>

  <!-- Address -->
  <div class="inv-field" ng-class="{'inv-field--error': invErrors.nok_address}">
    <label class="inv-field__label">Address <span class="inv-required">*</span></label>
    <address-lookup placeholder="Start typing their address…"
                    on-select="formData.nok.address = address.formatted || address.line1; clearInvError('nok_address')"></address-lookup>
    <textarea class="inv-field__input" ng-model="formData.nok.address" placeholder="Full address" rows="3" ng-change="clearInvError('nok_address')" required></textarea>
    <div class="inv-field__error">Address is required</div>
  </div>

  <!-- Buttons -->
  <div class="inv-btn-group">
    <a class="inv-btn inv-btn--secondary inv-btn--back" ui-sref="invitations.your_details" ng-click="setInvStep(2)">
      <i class="fa fa-arrow-left"></i>
    </a>
    <a class="inv-btn inv-btn--primary" ng-click="validateNextOfKin()">
      Next Step <i class="fa fa-arrow-right"></i>
    </a>
  </div>
</div>
