<div>
    <h2 class="inv-title">Create Your Password</h2>
    <p class="inv-subtitle">Please create a secure password for your account.</p>

    <div class="inv-field" ng-class="{'inv-field--error': formErrors.password}">
        <label class="inv-field__label">Password</label>
        <input type="password" class="inv-field__input" name="password" ng-model="formData.password" ng-change="clearFormError('password')" required />
        <span class="inv-field__error" ng-show="formErrors.password">{{formErrors.password}}</span>
    </div>

    <div class="inv-field" ng-class="{'inv-field--error': formErrors.password2}">
        <label class="inv-field__label">Confirm Password</label>
        <input type="password" class="inv-field__input" name="password2" ng-model="formData.password2" ng-change="clearFormError('password2')" required />
        <span class="inv-field__error" ng-show="formErrors.password2">{{formErrors.password2}}</span>
    </div>

    <p class="inv-field__hint">Password must be at least 8 characters long and include a mix of letters and numbers.</p>

    <div class="inv-btn-group">
        <a one-ui-sref="user_signup.next_of_kin" ng-click="submit_user_for_signup(); $event.stopPropagation();" class="inv-btn inv-btn--primary">
            Complete Registration
        </a>
    </div>
</div>
