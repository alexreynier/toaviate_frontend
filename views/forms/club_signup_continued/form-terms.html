<div>
  <h2 class="inv-title">Terms &amp; Conditions</h2>
  <p class="inv-subtitle">Please read carefully and accept our terms and conditions to proceed.</p>

  <!-- T&C agreement -->
  <label class="inv-agreement" ng-class="{'inv-agreement--checked': formData.tnc, 'inv-agreement--error': formErrors.tnc}">
    <input type="checkbox" ng-model="formData.tnc" ng-change="clearFormError('tnc')" required>
    <div class="inv-agreement__check"></div>
    <div class="inv-agreement__text">
      I have read, understand and agree to the full <a ng-click="downloadClubDocument(); $event.preventDefault();">Terms &amp; Conditions</a> and <a ng-click="downloadClubDocument(); $event.preventDefault();">Terms of Service</a> of the software.
    </div>
  </label>

  <!-- Buttons -->
  <div class="inv-btn-group">
    <a class="inv-btn inv-btn--secondary inv-btn--back" ng-click="setFormStep(2)">
      <i class="fa fa-arrow-left"></i>
    </a>
    <a class="inv-btn inv-btn--primary" ng-click="validateTerms2()">
      <i class="fa fa-check-circle"></i> I Agree
    </a>
  </div>
</div>
