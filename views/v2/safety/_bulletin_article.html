<!-- a bulletin as a readable article (expects `b` on the scope) -->
<article class="saf-article">
  <div class="saf-article__meta">
    <span class="ta-tag"><i class="fas" ng-class="b._type.icon"></i>{{ b._type.label }}</span>
    <span ng-show="b.published_at">Published {{ vm.fDayLong(b.published_at) }}</span>
    <span ng-show="b.author_first || b.author_last">{{ b.author_first }} {{ b.author_last }}</span>
    <span ng-show="vm.audience(b)">{{ vm.audience(b) }}</span>
    <span class="saf-valid" ng-show="b._valid" ng-class="{'saf-valid--upcoming': b._upcoming, 'saf-valid--expired': b._expired}"><i class="far fa-calendar-alt"></i>{{ b._valid }}</span>
  </div>
  <!-- paragraphs and lists stay direct children of the article grid (ng-show: ng-if is inert on an ng-repeat element in 1.4.7) -->
  <p ng-repeat-start="part in b._paras" ng-show="part.p">{{ part.p }}</p>
  <ul ng-repeat-end ng-show="part.list"><li ng-repeat="li in part.list track by $index">{{ li }}</li></ul>
  <p class="ta-muted" ng-if="!b._paras.length">This bulletin has no text.</p>
</article>
