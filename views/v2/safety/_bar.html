<!-- v2 Safety hub page bar: title, Back, three tabs (Overview · To acknowledge · Bulletins) and the club scope -->
<section class="ta-bar" aria-label="Safety">
  <div class="ta-bar__row">
    <div class="ta-bar__title">
      <span class="ta-bar__icon"><i class="fas fa-shield-alt" aria-hidden="true"></i></span>
      <div>
        <h2>Safety</h2>
        <p>Report hazards and occurrences, and keep up with {{ vm.clubName ? vm.clubName + '’s' : 'your club’s' }} safety notices.</p>
        <p class="saf-classic"><design-back></design-back></p>
      </div>
    </div>
    <a class="ta-back" ui-sref="dashboard.my_account" aria-label="Back to My Account"><i class="fas fa-arrow-left"></i><span class="ta-back__txt">My Account</span></a>
  </div>
  <div class="ta-bar__row ta-bar__row--tools">
    <div class="ta-tabs saf-tabs" role="tablist">
      <button type="button" class="ta-tab" ng-class="{'ta-tab--on': vm.screen === 'home'}" ng-click="vm.go('home')" role="tab" aria-selected="{{ vm.screen === 'home' }}" no-busy-guard><i class="fas fa-shield-alt"></i>Overview</button>
      <button type="button" class="ta-tab" ng-class="{'ta-tab--on': vm.screen === 'acks'}" ng-click="vm.go('acks')" role="tab" aria-selected="{{ vm.screen === 'acks' }}" no-busy-guard><i class="fas fa-file-signature"></i><span class="ta-desk-only">To acknowledge</span><span class="ta-phone-only">Acknowledge</span><span class="ta-tab__n" ng-show="vm.pending().length">{{ vm.pending().length }}</span></button>
      <button type="button" class="ta-tab" ng-class="{'ta-tab--on': vm.screen === 'bulletins'}" ng-click="vm.go('bulletins')" role="tab" aria-selected="{{ vm.screen === 'bulletins' }}" no-busy-guard><i class="fas fa-bullhorn"></i>Bulletins<span class="ta-tab__n" ng-show="vm.unreadCount">{{ vm.unreadCount }}</span></button>
    </div>
    <div class="ta-scope saf-tools-end" ng-show="vm.multiClub">
      <span class="ta-scope__k">Showing</span>
      <div class="ta-scope__set">
        <button type="button" class="ta-scope__opt" ng-repeat="c in vm.clubs" ng-class="{'ta-scope__opt--on': c.id == vm.club_id}" aria-pressed="{{ c.id == vm.club_id }}" ng-click="vm.selectClub(c.id)" no-busy-guard>{{ c.name }}</button>
      </div>
    </div>
  </div>
</section>
