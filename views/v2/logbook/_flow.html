<!-- v2 logbook — the import flow head: SkyDemon logs · Spreadsheet (CSV), and Upload → Check & match → Added.
     Scope: vm (screen 'import' | 'skydemon'); vm.flowStep() = 'pick' | 'review' | 'done'. -->
<section class="ta-card lgb-flow">
  <div class="ta-seg ta-seg--row" style="--seg-n:2" role="tablist" aria-label="Import from">
    <button type="button" class="ta-seg__opt" ng-class="{'ta-seg__opt--on': vm.screen === 'skydemon'}" role="tab" aria-selected="{{ vm.screen === 'skydemon' ? 'true' : 'false' }}" ng-click="vm.go('skydemon')" no-busy-guard><i class="fas fa-location-arrow" aria-hidden="true"></i>SkyDemon logs</button>
    <button type="button" class="ta-seg__opt" ng-class="{'ta-seg__opt--on': vm.screen === 'import'}" role="tab" aria-selected="{{ vm.screen === 'import' ? 'true' : 'false' }}" ng-click="vm.go('import')" no-busy-guard><i class="fas fa-file-csv" aria-hidden="true"></i>Spreadsheet (CSV)</button>
  </div>
  <span class="ta-steps" aria-label="Progress">
    <span class="ta-steps__s" ng-class="{'ta-steps__s--now': vm.flowStep() === 'pick', 'ta-steps__s--done': vm.flowStep() !== 'pick'}"><i></i>Upload</span>
    <span class="ta-steps__line" ng-class="{'ta-steps__line--done': vm.flowStep() !== 'pick'}"></span>
    <span class="ta-steps__s" ng-class="{'ta-steps__s--now': vm.flowStep() === 'review', 'ta-steps__s--done': vm.flowStep() === 'done'}"><i></i>Check &amp; match</span>
    <span class="ta-steps__line" ng-class="{'ta-steps__line--done': vm.flowStep() === 'done'}"></span>
    <span class="ta-steps__s" ng-class="{'ta-steps__s--done': vm.flowStep() === 'done'}"><i></i>Added</span>
  </span>
</section>
