<!-- one questionnaire or piece of material attached to a course / lesson; expects x and attnKey ('next' | 'before' | other) -->
<span class="ta-ic" ng-class="{'trn-todo__ic--done': vm.D.todoDone(x), 'ta-ic--warn': !vm.D.todoDone(x) && vm.attn(attnKey)}"><i class="fas" ng-class="x.type === 'q' ? 'fa-clipboard-list' : (x.ft === 'video' ? 'fa-film' : 'fa-file-pdf')" aria-hidden="true"></i></span>
<div>
  <div class="trn-todo__t">{{ x.title }}</div>
  <div class="ta-hint" ng-show="x.desc">{{ x.desc }}</div>
  <div class="trn-todo__s">
    <span class="ta-pill ta-pill--{{ vm.D.qStatus(x, vm.attn(attnKey)).tone }}"><i class="fas {{ vm.D.qStatus(x, vm.attn(attnKey)).ic }}" ng-show="vm.D.qStatus(x, vm.attn(attnKey)).ic"></i>{{ vm.D.qStatus(x, vm.attn(attnKey)).label }}</span>
    <span ng-if="x.type === 'q'">{{ x.n ? vm.D.plural(x.n, 'question') : 'Questionnaire' }}<span ng-show="x.score"> · score {{ x.score[0] }} / {{ x.score[1] }}</span><span ng-show="x.at"> · {{ vm.D.fDate(x.at) }}</span></span>
    <span ng-if="x.type === 'm'">{{ x.ft === 'video' ? 'Video' : 'PDF' }}</span>
  </div>
</div>
<button type="button" class="ta-btn ta-btn--sm" ng-click="vm.openTodo(x)" no-busy-guard>{{ vm.D.qStatus(x, false).act }}</button>
