<!-- v2 · the Training hub page bar (Syllabus · Training records · Questionnaires · Exams · CAA forms), shared by the
     training and exams v2 pages. Expects vm.hub = { cur, title, hint, icon, todo, sign, tools? (a template URL) }.
     Tabs link to the v1 state names; the router opens their v2 pages while the v2 switch is on. -->
<section class="ta-bar">
  <div class="ta-bar__row">
    <div class="ta-bar__title">
      <span class="ta-bar__icon"><i class="fas {{ vm.hub.icon }}" aria-hidden="true"></i></span>
      <div>
        <h2>{{ vm.hub.title }}</h2>
        <p>{{ vm.hub.hint }}</p>
        <span class="trn-v2 ta-phone-only"><design-back></design-back></span>
      </div>
    </div>
    <span class="trn-bar-end"><span class="ta-desk-only"><design-back></design-back></span>
    <a class="ta-back" ui-sref="dashboard.my_account" title="Back to My Account" aria-label="Back to My Account"><i class="fas fa-arrow-left"></i><span class="ta-back__txt">My Account</span></a>
    </span>
  </div>
  <div class="ta-bar__row ta-bar__row--tools">
    <div class="ta-tabs trn-hubtabs" role="tablist" aria-label="Training" trn-tabs-in-view>
      <button type="button" class="ta-tab" ng-class="{'ta-tab--on': vm.hub.cur === 'syllabus'}" role="tab" aria-selected="{{ vm.hub.cur === 'syllabus' }}" ui-sref="dashboard.my_account.syllabus" no-busy-guard><i class="fas fa-book" aria-hidden="true"></i>Syllabus</button>
      <button type="button" class="ta-tab" ng-class="{'ta-tab--on': vm.hub.cur === 'records'}" role="tab" aria-selected="{{ vm.hub.cur === 'records' }}" ui-sref="dashboard.my_account.training_records" no-busy-guard><i class="fas fa-user-graduate" aria-hidden="true"></i>Training records</button>
      <button type="button" class="ta-tab" ng-class="{'ta-tab--on': vm.hub.cur === 'assigned'}" role="tab" aria-selected="{{ vm.hub.cur === 'assigned' }}" ui-sref="dashboard.my_account.questionnaires" no-busy-guard><i class="fas fa-clipboard-check" aria-hidden="true"></i>Questionnaires<span class="ta-tab__n" ng-show="vm.hub.todo">{{ vm.hub.todo }}</span></button>
      <button type="button" class="ta-tab" ng-class="{'ta-tab--on': vm.hub.cur === 'exams'}" role="tab" aria-selected="{{ vm.hub.cur === 'exams' }}" ui-sref="dashboard.my_account.my_exams" no-busy-guard><i class="fas fa-award" aria-hidden="true"></i>Exams</button>
      <button type="button" class="ta-tab" ng-class="{'ta-tab--on': vm.hub.cur === 'caa'}" role="tab" aria-selected="{{ vm.hub.cur === 'caa' }}" ui-sref="dashboard.my_account.caa_forms" no-busy-guard><i class="fas fa-file-contract" aria-hidden="true"></i>CAA forms<span class="ta-tab__n" ng-show="vm.hub.sign">{{ vm.hub.sign }}</span></button>
    </div>
    <div class="trn-hubtools" ng-if="vm.hub.tools" ng-include="vm.hub.tools"></div>
  </div>
</section>
