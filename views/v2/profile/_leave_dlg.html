<!-- "You have unsaved changes" — shown by ProfileV2Util.guardLeave when a form with typed text is about to be left -->
<div class="ta-dlg-scrim pro-scrim" ng-if="vm.leave" ng-click="vm.leaveScrim($event)">
    <div class="ta-dlg pro-leave" role="alertdialog" aria-modal="true" aria-labelledby="pro-lv-t" aria-describedby="pro-lv-s">
        <div class="ta-dlg__hd ta-dlg__hd--alert ta-dlg__hd--warn">
            <span class="ta-dlg__ic"><i class="fas fa-pen"></i></span>
            <div><div class="ta-dlg__title pro-dlg-t" id="pro-lv-t">Discard your changes?</div><div class="ta-dlg__sub" id="pro-lv-s">You've changed this form but haven't saved it.</div></div>
            <button type="button" class="ta-dlg__x" ng-click="vm.keepEditing()" aria-label="Keep editing" no-busy-guard>×</button>
        </div>
        <div class="ta-dlg__ft pro-leave__ft">
            <button type="button" class="ta-btn" id="pro-leave-discard" ng-click="vm.discard()" no-busy-guard><i class="fas fa-trash-alt"></i>Discard changes</button><span class="ta-sp"></span>
            <button type="button" class="ta-btn ta-btn--primary" id="pro-leave-keep" ng-click="vm.keepEditing()" no-busy-guard><i class="fas fa-pen"></i>Keep editing</button>
        </div>
    </div>
</div>
