<section class="ta-bar">
    <div class="ta-bar__row">
        <div class="ta-bar__title">
            <span class="ta-bar__icon"><i class="fas" ng-class="icon || 'fa-user'"></i></span>
            <div>
                <h2>{{ heading || 'My details' }}</h2>
                <p ng-show="!locked">{{ sub || 'Your personal information, emergency contacts and reminders' }}</p>
                <p class="pro-lockpill" ng-show="locked"><span class="ta-pill ta-pill--warn"><i class="fas fa-lock"></i>Locked until set up</span></p>
                <design-back class="pro-classic"></design-back>
            </div>
        </div>
        <a class="ta-back" href="" ng-show="!locked" ng-click="toAccount()" no-busy-guard aria-label="Back to My Account"><i class="fas fa-arrow-left"></i><span class="ta-back__txt">My Account</span></a>
    </div>
    <div class="ta-bar__row ta-bar__row--tools">
        <div class="ta-tabs pro-tabs" role="tablist" aria-label="My details">
            <button type="button" class="ta-tab" ng-repeat="t in tabs" role="tab" no-busy-guard
                    ng-class="{'ta-tab--on': t.k === active, 'pro-tab--locked': locked && t.k !== active}"
                    aria-selected="{{ t.k === active }}" ng-attr-aria-disabled="{{ (locked && t.k !== active) ? 'true' : undefined }}"
                    ng-attr-title="{{ (locked && t.k !== active) ? 'Opens once your sign-in has a second step' : undefined }}"
                    ng-click="go(t)">
                <i class="fas" ng-class="(locked && t.k !== active) ? 'fa-lock' : t.ic"></i>{{ t.t }}<span class="ta-tab__n" ng-show="t.k === 'nok' && nokCount">{{ nokCount }}</span>
            </button>
        </div>
    </div>
</section>
