<button type="button" class="vd-doc__main" ng-click="vm.viewDoc(d)" title="View {{ d.title }}" no-busy-guard>
  <span class="vd-ft vd-ft--{{ d.ft.k }}" title="{{ d.ft.label }}"><i class="fas {{ d.ft.ic }}" aria-hidden="true"></i></span>
  <span class="vd-doc__txt">
    <span class="vd-doc__t">{{ d.title }}</span>
    <span class="vd-doc__s" ng-show="d.description">{{ d.description }}</span>
  </span>
  <span class="vd-doc__meta">
    <span class="vd-doc__st"><span class="ta-pill ta-pill--info" ng-if="d.fresh === 'new'"><i class="fas fa-plus-circle"></i>New</span><span class="ta-pill ta-pill--info" ng-if="d.fresh === 'updated'"><i class="fas fa-sync-alt"></i>New version</span></span>
    <span class="vd-doc__date"><span class="vd-doc__type">{{ d.ft.label }} · </span><span ng-show="d.updated"><span class="vd-doc__upd">Updated </span>{{ vm.F.fDate(d.updated) }}</span><span ng-show="!d.file"> · no file yet</span></span>
  </span>
  <span class="vd-doc__go">{{ d._busy ? 'Opening' : 'View' }} <i class="fas" ng-class="d._busy ? 'fa-spinner fa-spin' : ((d.ft.k === 'pdf' || d.ft.k === 'img') ? 'fa-eye' : 'fa-external-link-alt')" aria-hidden="true"></i></span>
</button>
<button type="button" class="ta-ib vd-doc__dl" ng-click="vm.downloadDoc(d)" ng-disabled="d._busy" title="Download" aria-label="Download {{ d.title }}" no-busy-guard><i class="fas" ng-class="d._busy ? 'fa-spinner fa-spin' : 'fa-download'" aria-hidden="true"></i></button>
