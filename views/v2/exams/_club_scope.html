<div class="ta-scope" ng-show="vm.clubs.length > 1">
  <span class="ta-scope__k">Club</span>
  <div class="ta-scope__set" role="group" aria-label="Club">
    <button type="button" class="ta-scope__opt" ng-repeat="c in vm.clubs" ng-class="{'ta-scope__opt--on': vm.club === c}" aria-pressed="{{ vm.club === c }}" ng-click="vm.selectClub(c)" no-busy-guard>{{ c.title }}<span class="qx-past" ng-if="!c.member"> · past</span></button>
  </div>
</div>
