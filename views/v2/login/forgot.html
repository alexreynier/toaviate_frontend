<!-- ═══ v2 forgotten password (state password_reset_v2, /v2/password_reset) — PasswordResetV2Controller as vm.
     The answer is neutral (never says whether the address exists). ═══ -->
<div class="lg lg-page v2-host">
  <div ng-include="'views/v2/login/_top.html'"></div>
  <div class="lg-side">
    <div class="lg-main">

      <div class="lg-card" ng-if="!vm.sent" data-e2e="lg-forgot">
        <div class="lg-hd"><div class="lg-eyebrow"><i class="fas fa-key"></i>Forgotten password</div><h2>Reset your password</h2><p>Tell us your email address and we’ll send you a link to choose a new one.</p></div>
        <form class="lg-form" name="form" ng-submit="vm.send()" novalidate>
          <div class="ta-field" ng-class="{'ta-field--error': vm.errs.email}">
            <div class="lg-lbl"><label class="ta-label" for="reset_email">Email</label></div>
            <input class="ta-input" type="text" name="email" id="reset_email" ng-model="vm.email" ng-change="vm.clear('email')" autocomplete="username" inputmode="email" placeholder="you@example.com" autocapitalize="off" autocorrect="off" spellcheck="false">
            <span class="ta-field__msg" ng-if="vm.errs.email">{{ vm.errs.email }}</span>
          </div>
          <div class="ta-note ta-note--bad" role="alert" ng-if="vm.errs.form" data-e2e="lg-note"><i class="fas fa-exclamation-circle"></i><div>{{ vm.errs.form }}</div></div>
          <button type="submit" class="ta-btn ta-btn--primary lg-cta" ng-disabled="vm.busy" data-e2e="lg-submit"><span class="ta-spin" ng-if="vm.busy"></span>{{ vm.busy ? 'Sending…' : 'Send the link' }}</button>
          <div class="lg-row"><a class="ta-link" ui-sref="login_v2"><i class="fas fa-arrow-left"></i> Back to sign-in</a></div>
        </form>
      </div>

      <div class="lg-card" ng-if="vm.sent" data-e2e="lg-forgot-sent">
        <div class="lg-done">
          <span class="lg-done__ic lg-done__ic--mail"><i class="fas fa-envelope-open-text"></i></span>
          <h2>Check your email</h2>
          <p>If <b>{{ vm.email }}</b> has an account, a link to choose a new password is on its way.</p>
        </div>
        <div class="lg-row">
          <a class="ta-link" ui-sref="login_v2"><i class="fas fa-arrow-left"></i> Back to sign-in</a>
          <span class="ta-sp"></span>
          <button type="button" class="ta-link" ng-click="vm.sendAgain()" ng-disabled="vm.busy" no-busy-guard><i class="fas fa-paper-plane"></i> {{ vm.busy ? 'Sending…' : 'Send it again' }}</button>
        </div>
      </div>

    </div>
    <div ng-include="'views/v2/login/_foot.html'"></div>
  </div>
  <design-switch></design-switch>
</div>
