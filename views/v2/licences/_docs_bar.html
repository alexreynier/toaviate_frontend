<section class="ta-bar">
    <div class="ta-bar__row">
        <div class="ta-bar__title">
            <span class="ta-bar__icon"><i class="fas fa-folder-open"></i></span>
            <div>
                <h2>My documents</h2>
                <p>Licences, medical, differences training and proof of ID</p>
                <design-back class="lic-classic"></design-back>
            </div>
        </div>
        <a class="ta-back" href="" ng-click="toAccount()" no-busy-guard aria-label="Back to My Account"><i class="fas fa-arrow-left"></i><span class="ta-back__txt">My Account</span></a>
    </div>
    <div class="ta-bar__row ta-bar__row--tools">
        <div class="ta-tabs lic-tabs" role="tablist" aria-label="My documents">
            <button type="button" class="ta-tab" ng-repeat="t in tabs" role="tab" ng-class="{'ta-tab--on': t.k === active}" aria-selected="{{ t.k === active }}" ng-click="go(t)" no-busy-guard>
                <i class="fas" ng-class="t.ic"></i>{{ t.t }}<span class="ta-tab__n" ng-if="counts[t.k]">{{ counts[t.k] }}</span>
            </button>
        </div>
    </div>
</section>
