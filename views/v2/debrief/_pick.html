<div class="ta-field" ng-class="{'ta-field--error': P.err}" id="dbf-f-{{ f }}">
  <span class="ta-label"><i class="fas {{ P.labelIc }}" aria-hidden="true" ng-if="P.labelIc"></i>{{ P.label }}{{ P.req ? ' ' : '' }}<span class="ta-req" ng-if="P.req">Required</span></span>
  <div class="ta-pickf"><button type="button" class="ta-pick" ng-class="{'ta-pick--empty': !P.title}" ng-click="vm.cbOpen(f)" aria-haspopup="listbox" aria-expanded="{{ vm.cb.f === f }}" ng-disabled="P.disabled" data-e2e="dbf-pick-{{ f }}"><span class="ta-av" ng-if="P.av" ng-attr-style="--av: {{ P.av.c }}" title="{{ P.av.tip }}">{{ P.av.ini }}</span><span class="ta-av ta-av--member" ng-if="P.avEmpty"><i class="fas fa-user-plus"></i></span><span class="ta-pick__ic" ng-if="P.num">{{ P.num }}</span><span class="ta-pick__ic" ng-if="P.ic && !P.num"><i class="fas {{ P.ic }}"></i></span><span class="ta-pick__txt"><span class="ta-pick__nm">{{ P.title || P.ph || 'Choose…' }}</span><span class="ta-pick__sub" ng-if="P.sub">{{ P.sub }}</span></span><span class="ta-pick__end" ng-if="!P.noEnd">{{ P.title ? 'Change' : 'Choose' }} <i class="fas fa-chevron-down"></i></span></button>
    <div class="ta-pickmenu-scrim" ng-if="vm.cb.f === f" ng-click="vm.cbClose()"></div>
    <div class="ta-pickmenu" role="dialog" aria-label="Choose: {{ P.cbTitle }}" ng-if="vm.cb.f === f" data-e2e="dbf-pickmenu"><div class="ta-pickmenu__grab"></div><div class="ta-pickmenu__hd"><b>{{ P.cbTitle }}</b><button type="button" class="ta-dlg__x" ng-if="!P.closeIb" ng-click="vm.cbClose()" aria-label="Close">×</button><button type="button" class="ta-ib" ng-if="P.closeIb" ng-click="vm.cbClose()" aria-label="Close"><i class="fas fa-times"></i></button></div>
      <div class="ta-pickmenu__top"><label class="ta-search"><i class="fas fa-search"></i><input id="dbf-cb-q" type="search" autocomplete="off" role="combobox" aria-expanded="true" aria-controls="dbf-cb-list" aria-activedescendant="dbf-cb-o-{{ vm.cb.hi }}" placeholder="{{ P.cbPh }}" ng-model="vm.cb.q" ng-change="vm.cbQ()" ng-keydown="vm.cbKey($event)" data-e2e="dbf-cb-q"></label></div>
      <div class="ta-pickmenu__hint" ng-if="vm.cbm.hint"><i class="fas fa-info-circle"></i>{{ vm.cbm.hint }}</div>
      <div class="ta-pickmenu__empty" ng-if="vm.cbm.empty"><b>{{ vm.cbm.empty.t }}</b><span ng-if="vm.cbm.empty.s">{{ vm.cbm.empty.s }}</span></div>
      <ul class="ta-pickmenu__list" id="dbf-cb-list" role="listbox" ng-if="!vm.cbm.empty"><li ng-repeat="r in vm.cbm.rows track by r.rk" ng-attr-id="{{ r.grp ? undefined : 'dbf-cb-o-' + r.idx }}" role="{{ r.grp ? 'presentation' : 'option' }}" ng-attr-aria-selected="{{ r.grp ? undefined : (r.on ? 'true' : 'false') }}" ng-class="r.grp ? 'ta-pickmenu__grp' : (r.idx === vm.cb.hi ? 'ta-pickmenu__opt ta-pickmenu__opt--hi' : 'ta-pickmenu__opt')" ng-click="r.grp || vm.cbPick(r)" data-e2e="{{ r.grp ? 'dbf-cb-grp' : 'dbf-cb-opt' }}">{{ r.grp }}<span class="ta-av" ng-if="r.av" ng-attr-style="--av: {{ r.av.c }}" title="{{ r.av.tip }}">{{ r.av.ini }}</span><span class="ta-pick__ic" ng-if="r.num">{{ r.num }}</span><span class="ta-pick__ic" ng-if="r.ic"><i class="fas {{ r.ic }}"></i></span><span class="ta-pickmenu__txt" ng-if="!r.grp"><span class="ta-pickmenu__t" ng-bind-html="r.th"></span><span class="ta-pickmenu__s" ng-class="r.scls" ng-if="r.s">{{ r.s }}</span></span><i class="fas fa-check ta-pickmenu__chk" aria-label="Selected" ng-if="r.on"></i></li></ul>
      <div class="ta-pickmenu__foot" ng-if="vm.cbm.foot"><span>{{ vm.cbm.foot }}</span><span ng-if="vm.cbm.keys"><kbd>↑</kbd><kbd>↓</kbd> <kbd>Enter</kbd></span></div></div>
  </div>
  <span class="ta-field__msg" ng-if="P.err">{{ P.err }}</span><span class="ta-hint" ng-if="!P.err && P.hint">{{ P.hint }}</span>
</div>
