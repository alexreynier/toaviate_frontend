<!-- the hero figures of one aircraft (expects `p`): hours + days to maintenance, the meter when it has one.
     The bars EMPTY like a fuel gauge as time runs out. -->
<div class="ta-tile" ng-class="{'ta-tile--bad': p._hours.tone === 'bad', 'ta-tile--attn': p._hours.tone === 'warn'}">
  <span class="ta-tile__k"><i class="fas fa-hourglass-half"></i>Hours to maintenance</span>
  <span class="ta-tile__v">{{ p._hours.v }}</span>
  <span class="ta-tile__s">{{ p._hours.s }}</span>
  <div class="ta-meter" ng-if="p._hours.pct != null" ng-class="{'ta-meter--bad': p._hours.tone === 'bad', 'ta-meter--warn': p._hours.tone === 'warn'}"><div class="ta-meter__bar" style="--v: {{ p._hours.pct }}%"></div></div>
</div>
<div class="ta-tile" ng-class="{'ta-tile--bad': p._days.tone === 'bad', 'ta-tile--attn': p._days.tone === 'warn'}">
  <span class="ta-tile__k"><i class="fas fa-calendar-alt"></i>Days to maintenance</span>
  <span class="ta-tile__v" ng-class="{'ta-tile__v--words': p._days.words}">{{ p._days.v }}</span>
  <span class="ta-tile__s">{{ p._days.s }}</span>
  <div class="ta-meter" ng-if="p._days.pct != null" ng-class="{'ta-meter--bad': p._days.tone === 'bad', 'ta-meter--warn': p._days.tone === 'warn'}"><div class="ta-meter__bar" style="--v: {{ p._days.pct }}%"></div></div>
</div>
<div class="ta-tile" ng-if="p._meter" ng-class="{'acs-hero__m': meterStrip}">
  <span class="ta-tile__k"><i class="fas fa-tachometer-alt"></i>{{ p._meter.label }}</span>
  <span class="ta-tile__v">{{ p._meter.v }}</span>
  <span class="ta-tile__s">{{ p._meter.s }}</span>
</div>
