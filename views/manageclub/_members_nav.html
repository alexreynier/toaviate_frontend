<!-- Shared sub-nav for the consolidated "Members" admin hub.
     ng-include'd below the header on: members.html, member_requests.html,
     instructor_bookings.html and missing_students.html.
     Routes/controllers are untouched — this is navigation chrome only.
     Reuses the .trk-tabs underline styling (css/trackers.css), the
     established manage_club sub-nav look; hub spacing is .mchub-tabs
     in css/manage-club-hubs.css.

     All four states are leaves, so unlike _vouchers_nav.html this bar
     needs no state gate — which also means it works on
     missing_students.html, whose MissingStudentsController is the one
     controller here that does NOT inject $state.

     NOTE: Instructors is dashboard.manage_instructor_bookings — a
     TOP-LEVEL state, not under dashboard.manage_club. Don't "correct"
     it to a manage_club child; the route would not resolve. -->
<div class="trk-tabs mchub-tabs">
    <a class="trk-tab" ui-sref="dashboard.manage_club.members" ui-sref-active="trk-tab--active">
        <i class="fas fa-users"></i> Members
    </a>
    <a class="trk-tab" ui-sref="dashboard.manage_club.member_requests" ui-sref-active="trk-tab--active">
        <i class="fas fa-user-plus"></i> Requests
    </a>
    <a class="trk-tab" ui-sref="dashboard.manage_instructor_bookings" ui-sref-active="trk-tab--active">
        <i class="fas fa-user-tie"></i> Instructors
    </a>
    <a class="trk-tab" ui-sref="dashboard.manage_club.missing_students" ui-sref-active="trk-tab--active">
        <i class="fas fa-user-times"></i> Missing Students
    </a>
</div>
