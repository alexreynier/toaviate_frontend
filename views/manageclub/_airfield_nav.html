     AreaHubController hub.inArea); it hides when the page renders under another area.

     ng-include'd below the header on airfield_bookout.html and
     airfield_hub_club.html. Routes/controllers are untouched — navigation

     (css/manage-club-hubs.css). Both states are leaves, so no state gate. -->
<div class="trk-tabs mchub-tabs" data-e2e="airfield-hub-tabs" ng-if="!hub || hub.inArea('ops')">

        <i class="fas fa-broadcast-tower"></i> Airfield Bookout
    </a>
    <a class="trk-tab" ui-sref="dashboard.manage_club.airfield_hub" ui-sref-active="trk-tab--active">
