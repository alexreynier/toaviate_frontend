<div class="modal-header">
  <h3 class="modal-title"><i class="fa fa-exclamation-triangle"></i> Report a problem</h3>
  <p>Tracker {{ m.unit.serial || '' }} · {{ m.unit.version_name }}</p>
</div>
<div class="modal-body">

  <div class="trk-section">
    <h5 class="trk-section-title">What's happened?</h5>
    <div class="trk-form-grid">
      <div class="trk-field">
        <label for="field-trk-rma-type">Type <span class="trk-req">*</span></label>
        <select id="field-trk-rma-type" class="trk-select" ng-model="m.form.type">
          <option value="malfunction">It's not working properly (malfunction)</option>
          <option value="return">I want to send it back (return)</option>
        </select>
      </div>
      <div class="trk-field">
        <label for="field-trk-rma-reason">Reason <span class="trk-req">*</span></label>
        <select id="field-trk-rma-reason" class="trk-select" ng-model="m.form.reason"
                ng-options="r as m.pretty(r) for r in m.reasons"></select>
      </div>
      <div class="trk-field trk-field--full">
        <label for="field-trk-rma-desc">Tell us more</label>
        <textarea id="field-trk-rma-desc" class="trk-textarea" ng-model="m.form.description"
                  placeholder="What's wrong, when it started, anything you've already tried…"></textarea>
      </div>
    </div>
  </div>

  <div class="trk-banner trk-banner--info" ng-if="m.form.type === 'return'" style="margin-bottom: 0;">
    <i class="fa fa-info-circle"></i>
    <div class="trk-banner__body">For returns, <strong style="display:inline;">billing stops once we receive the unit back</strong>. We'll send shipping instructions once the return is approved.</div>
  </div>
  <div class="trk-banner trk-banner--info" ng-if="m.form.type === 'malfunction'" style="margin-bottom: 0;">
    <i class="fa fa-info-circle"></i>
    <div class="trk-banner__body">The tracker stays active while we investigate the fault.</div>
  </div>

</div>
<div class="modal-footer">
  <button class="trk-btn trk-btn--ghost" ng-click="m.cancel()" ng-disabled="m.saving">Cancel</button>
  <button class="trk-btn trk-btn--primary" ng-click="m.submit()" ng-disabled="m.saving">
    <span ng-if="m.saving" class="trk-spinner trk-spinner--inline"></span>
    <i class="fa fa-paper-plane" ng-if="!m.saving"></i> Send report
  </button>
</div>
