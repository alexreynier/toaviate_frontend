<div class="modal-header">
  <h3 class="modal-title"><i class="fa fa-pen"></i> Edit unit</h3>
  <p>{{ m.unit.serial }} · {{ m.unit.club_title }}</p>
</div>
<div class="modal-body">
  <div class="trk-section">
    <div class="trk-form-grid">
      <div class="trk-field">
        <label for="field-trk-unit-serial">Serial <span class="trk-req">*</span></label>
        <input id="field-trk-unit-serial" class="trk-input" type="text" ng-model="m.form.serial">
      </div>
      <div class="trk-field">
        <label>Fox tracker (device registry)</label>
        <ui-select ng-model="m.fox_pick" theme="bootstrap" title="Link to a fox tracker">
          <ui-select-match placeholder="Search by IMEI or label…" allow-clear="true">{{ m.trackerLabel($select.selected) }}</ui-select-match>
          <ui-select-choices repeat="t in m.trackers | filter: $select.search">
            <div>{{ m.trackerLabel(t) }}</div>
          </ui-select-choices>
        </ui-select>
      </div>
      <div class="trk-field">
        <label for="field-trk-unit-price">Monthly price override</label>
        <input id="field-trk-unit-price" class="trk-input" type="number" step="0.01" min="0" ng-model="m.form.monthly_price">
        <div class="trk-field__hint">Leave as-is to keep the version's standard price.</div>
      </div>
      <div class="trk-field">
        <label for="field-trk-unit-vat">VAT rate (%)</label>
        <input id="field-trk-unit-vat" class="trk-input" type="number" step="0.1" min="0" ng-model="m.form.vat_rate">
      </div>
      <div class="trk-field trk-field--full">
        <label for="field-trk-unit-notes">Notes</label>
        <textarea id="field-trk-unit-notes" class="trk-textarea" ng-model="m.form.notes"></textarea>
      </div>
    </div>
  </div>
</div>
<div class="modal-footer">
  <button class="trk-btn trk-btn--ghost" ng-click="m.cancel()" ng-disabled="m.saving">Cancel</button>
  <button class="trk-btn trk-btn--primary" ng-click="m.submit()" ng-disabled="m.saving">
    <span ng-if="m.saving" class="trk-spinner trk-spinner--inline"></span>
    <i class="fa fa-check" ng-if="!m.saving"></i> Save unit
  </button>
</div>
