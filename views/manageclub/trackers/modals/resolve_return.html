<div class="modal-header">
  <h3 class="modal-title"><i class="fa fa-clipboard-check"></i> Resolve return</h3>
  <p>{{ m.rma.rma_number }} · {{ m.rma.serial }}</p>
</div>
<div class="modal-body">
  <div class="trk-section">
    <div class="trk-form-grid">
      <div class="trk-field">
        <label for="field-trk-resolve-resolution">Resolution <span class="trk-req">*</span></label>
        <select id="field-trk-resolve-resolution" class="trk-select" ng-model="m.form.resolution"
                ng-options="r as m.pretty(r) for r in m.resolutions"></select>
      </div>
      <div class="trk-field trk-field--full">
        <label for="field-trk-resolve-notes">Notes</label>
        <textarea id="field-trk-resolve-notes" class="trk-textarea" ng-model="m.form.resolution_notes" placeholder="What was done, findings, next steps…"></textarea>
      </div>
    </div>
  </div>

  <div class="trk-section" ng-if="m.form.resolution === 'replaced'">
    <h5 class="trk-section-title">Replacement unit</h5>
    <div class="trk-form-grid">
      <div class="trk-field">
        <label for="field-trk-resolve-serial">Replacement serial <span class="trk-req">*</span></label>
        <input id="field-trk-resolve-serial" class="trk-input" type="text" ng-model="m.form.replacement_serial">
      </div>
      <div class="trk-field">
        <label>Fox tracker (device registry, optional)</label>
        <ui-select ng-model="m.form.fox_pick" theme="bootstrap" title="Link to a fox tracker">
          <ui-select-match placeholder="Search by IMEI or label…" allow-clear="true">{{ m.trackerLabel($select.selected) }}</ui-select-match>
          <ui-select-choices repeat="t in m.trackers | filter: $select.search">
            <div>{{ m.trackerLabel(t) }}</div>
          </ui-select-choices>
        </ui-select>
      </div>
    </div>
    <p class="trk-field__hint">The replacement becomes a new unit with continuous billing.</p>
  </div>

  <div class="trk-banner trk-banner--info" ng-if="m.form.resolution === 'repaired' || m.form.resolution === 'no_fault_found'" style="margin-bottom: 0;">
    <i class="fa fa-info-circle"></i>
    <div class="trk-banner__body">This puts the unit back to <strong style="display:inline;">active billing</strong>.</div>
  </div>
</div>
<div class="modal-footer">
  <button class="trk-btn trk-btn--ghost" ng-click="m.cancel()" ng-disabled="m.saving">Cancel</button>
  <button class="trk-btn trk-btn--success" ng-click="m.submit()" ng-disabled="m.saving">
    <span ng-if="m.saving" class="trk-spinner trk-spinner--inline"></span>
    <i class="fa fa-check" ng-if="!m.saving"></i> Resolve case
  </button>
</div>
