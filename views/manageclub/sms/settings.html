<div class="sms-page">

  <div class="sms-page__header">
    <div class="sms-page__header-inner">
      <div class="back-box" ui-sref="dashboard.manage_club.sms">
        <i class="fa fa-arrow-circle-left"></i> BACK
      </div>
      <div class="sms-page__title">
        <h2><i class="fa fa-cog"></i> SMS Settings</h2>
        <p>Organisation details and key safety post holders.</p>
      </div>
      <div class="sms-page__header-actions"></div>
    </div>
  </div>

  <div class="sms-page__body">

    <div ng-include="'views/manageclub/sms/_nav.html'"></div>

    <div class="sms-loading" ng-if="vm.loading">
      <div class="sms-spinner"></div> Loading…
    </div>

    <div class="snazzy-reveal" ng-if="!vm.loading">

      <div class="sms-empty" ng-if="!vm.access.isAdmin">
        <i class="fa fa-lock"></i>
        <p>Only club admins can manage SMS settings.</p>
      </div>

      <div ng-if="vm.access.isAdmin">

        <div class="sms-card">
          <div class="sms-card__title">
            <i class="fa fa-building"></i> Organisation
          </div>

          <div class="sms-form-grid">
            <div class="sms-field">
              <label>Organisation Type</label>
              <select class="sms-select" ng-model="vm.settingsForm.org_type">
                <option value="ATO">ATO</option>
                <option value="DTO">DTO</option>
              </select>
            </div>

            <div class="sms-field">
              <label>CAA Approval Reference</label>
              <input type="text" class="sms-input" ng-model="vm.settingsForm.caa_approval_ref">
            </div>
          </div>
        </div>

        <div class="sms-card">
          <div class="sms-card__title">
            <i class="fa fa-user-shield"></i> Safety Post Holders
          </div>

          <div class="sms-form-grid">
            <div class="sms-field" ng-repeat="post in vm.posts">
              <label>{{ post.label }}</label>
              <select class="sms-select" ng-model="vm.settingsForm[post.field]">
                <option value="">— none —</option>
                <option ng-repeat="m in vm.members" value="{{ m.user_id || m.id }}">
                  {{ m.first_name }} {{ m.last_name }}
                </option>
              </select>
            </div>
          </div>
        </div>

        <div style="margin-top:16px;">
          <button class="sms-btn sms-btn--primary sms-btn--lg"
                  ng-click="vm.saveSettings()" ng-disabled="vm.saving">
            <i class="fa" ng-class="{'fa-spinner fa-spin':vm.saving,'fa-save':!vm.saving}"></i>
            Save Settings
          </button>
        </div>

      </div>

    </div>

  </div>
</div>
