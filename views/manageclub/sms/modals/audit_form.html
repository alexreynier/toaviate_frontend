<div class="modal-header">
  <h3 class="modal-title"><i class="fa fa-clipboard-check"></i> New Audit</h3>
</div>

<div class="modal-body">
  <div class="sms-form-grid">
    <div class="sms-field sms-field--full">
      <label>Title <span class="sms-req">*</span></label>
      <input type="text" class="sms-input" ng-model="m.audit.title" placeholder="e.g. Annual SMS compliance audit">
    </div>
    <div class="sms-field">
      <label>Type</label>
      <select class="sms-select" ng-model="m.audit.audit_type">
        <option value="internal">Internal</option>
        <option value="external">External</option>
        <option value="regulatory">Regulatory</option>
      </select>
    </div>
    <div class="sms-field">
      <label>Scheduled Date</label>
      <input type="date" class="sms-input" ng-model="m.audit.scheduled_date">
    </div>
    <div class="sms-field sms-field--full">
      <label>Scope</label>
      <textarea class="sms-textarea" ng-model="m.audit.scope" placeholder="What areas does this audit cover?"></textarea>
    </div>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="sms-btn sms-btn--ghost" ng-click="m.cancel()">Cancel</button>
  <button type="button" class="sms-btn sms-btn--primary" ng-click="m.save()" ng-disabled="m.saving">
    <i class="fa" ng-class="{'fa-spinner fa-spin': m.saving, 'fa-check': !m.saving}"></i>
    {{ m.saving ? 'Creating…' : 'Create Audit' }}
  </button>
</div>
