<div class="modal-header">
  <h3 class="modal-title"><i class="fa fa-check"></i> Complete Action</h3>
</div>

<div class="modal-body">
  <div class="sms-detail__section" style="margin-bottom: 14px;">
    <div class="sms-detail__section-title">{{ m.action.title }}</div>
    <p class="sms-table__muted" style="margin: 2px 0 0;">{{ m.action.reference }}<span ng-if="m.action.due_date"> · Due {{ m.action.due_date | date:'mediumDate' }}</span></p>
  </div>

  <div class="sms-form-grid">
    <div class="sms-field sms-field--full">
      <label>What was done? <span class="sms-req">*</span></label>
      <textarea class="sms-textarea" ng-model="m.evidence" rows="5" placeholder="Describe the corrective action taken and any supporting evidence…"></textarea>
      <div class="sms-field__hint">Provide enough detail for the Safety Manager to verify this action is complete.</div>
    </div>
  </div>
</div>

<div class="modal-footer">
  <button type="button" class="sms-btn sms-btn--ghost" ng-click="m.cancel()" ng-disabled="m.saving">Cancel</button>
  <button type="button" class="sms-btn sms-btn--success" ng-click="m.save()" ng-disabled="m.saving || !m.evidence">
    <span ng-if="m.saving" class="sms-spinner"></span>
    <i ng-if="!m.saving" class="fa fa-check"></i>
    {{ m.saving ? 'Saving…' : 'Save' }}
  </button>
</div>
