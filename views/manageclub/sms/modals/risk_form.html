<div class="modal-header">
  <h3 class="modal-title"><i class="fa fa-th"></i> {{ m.isEdit ? 'Edit' : 'New' }} Risk</h3>
</div>

<div class="modal-body">

  <div class="sms-form-grid">

    <div class="sms-field sms-field--full">
      <label>Title <span class="sms-req">*</span></label>
      <input type="text" class="sms-input" ng-model="m.risk.title" placeholder="Short risk title" />
    </div>

    <div class="sms-field sms-field--full">
      <label>Hazard Source</label>
      <input type="text" class="sms-input" ng-model="m.risk.hazard_source" placeholder="Where does this risk arise?" />
    </div>

    <div class="sms-field sms-field--full">
      <label>Existing Controls</label>
      <textarea class="sms-textarea" ng-model="m.risk.existing_controls"
                placeholder="Controls already in place"></textarea>
    </div>

    <div class="sms-field sms-field--full">
      <label>Proposed Mitigations</label>
      <textarea class="sms-textarea" ng-model="m.risk.proposed_mitigations"
                placeholder="Further mitigations to reduce residual risk"></textarea>
    </div>

    <div class="sms-field">
      <label>Owner</label>
      <input type="text" class="sms-input" ng-model="m.risk.owner" placeholder="Responsible person" />
    </div>

    <div class="sms-field">
      <label>Review Date</label>
      <input type="date" class="sms-input" ng-model="m.risk.review_date" />
    </div>

    <div class="sms-field">
      <label>Status</label>
      <select class="sms-select" ng-model="m.risk.status">
        <option value="open">Open</option>
        <option value="monitoring">Monitoring</option>
        <option value="closed">Closed</option>
      </select>
    </div>

  </div>

  <div style="display:flex; flex-wrap:wrap; gap:28px; margin-top:22px;">

    <div>
      <div class="sms-card__title" style="margin-bottom:8px;">Initial</div>
      <div style="display:flex; align-items:stretch;">
        <div class="sms-matrix__axis" style="writing-mode:vertical-rl; transform:rotate(180deg); margin-right:6px;">Likelihood</div>
        <div>
          <div class="sms-matrix">
            <div class="sms-matrix__row">
              <div class="sms-matrix__cell" style="background:transparent; cursor:default;"></div>
              <div class="sms-matrix__cell sms-matrix__axis" ng-repeat="sv in m.scale" style="background:transparent; cursor:default;">{{ sv }}</div>
            </div>
            <div class="sms-matrix__row" ng-repeat="l in m.scale">
              <div class="sms-matrix__cell sms-matrix__axis" style="background:transparent; cursor:default;">{{ l }}</div>
              <div class="sms-matrix__cell"
                   ng-repeat="sv in m.scale"
                   ng-style="{background: m.cellColour(l, sv)}"
                   ng-class="{'sms-matrix__cell--selected': m.isSel('initial', l, sv)}"
                   ng-click="m.pick('initial', l, sv)">{{ l * sv }}</div>
            </div>
          </div>
          <div class="sms-matrix__axis" style="text-align:center; margin-top:6px;">Severity</div>
        </div>
      </div>
    </div>

    <div>
      <div class="sms-card__title" style="margin-bottom:8px;">Residual</div>
      <div style="display:flex; align-items:stretch;">
        <div class="sms-matrix__axis" style="writing-mode:vertical-rl; transform:rotate(180deg); margin-right:6px;">Likelihood</div>
        <div>
          <div class="sms-matrix">
            <div class="sms-matrix__row">
              <div class="sms-matrix__cell" style="background:transparent; cursor:default;"></div>
              <div class="sms-matrix__cell sms-matrix__axis" ng-repeat="sv in m.scale" style="background:transparent; cursor:default;">{{ sv }}</div>
            </div>
            <div class="sms-matrix__row" ng-repeat="l in m.scale">
              <div class="sms-matrix__cell sms-matrix__axis" style="background:transparent; cursor:default;">{{ l }}</div>
              <div class="sms-matrix__cell"
                   ng-repeat="sv in m.scale"
                   ng-style="{background: m.cellColour(l, sv)}"
                   ng-class="{'sms-matrix__cell--selected': m.isSel('residual', l, sv)}"
                   ng-click="m.pick('residual', l, sv)">{{ l * sv }}</div>
            </div>
          </div>
          <div class="sms-matrix__axis" style="text-align:center; margin-top:6px;">Severity</div>
        </div>
      </div>
    </div>

  </div>

</div>

<div class="modal-footer">
  <button type="button" class="sms-btn sms-btn--ghost" ng-click="m.cancel()">Cancel</button>
  <button type="button" class="sms-btn sms-btn--primary" ng-click="m.save()" ng-disabled="m.saving">
    <i class="fa" ng-class="{'fa-spinner fa-spin': m.saving, 'fa-check': !m.saving}"></i>
    {{ m.saving ? 'Saving…' : 'Save' }}
  </button>
</div>
