<!-- Shared SMS admin sub-navigation. ng-include'd by every admin SMS screen. -->
<!-- Club picker (SmsController.clubPicker) when the user has more than one SMS club:
     - an SMS post holder (not a club admin) with posts at several clubs;
     - a club admin who also holds an SMS post at a club they don't run: the
       Manage Club club + those post clubs (other clubs they run are switched
       with the header club switcher, as for the rest of Manage Club). -->
<div class="sms-card sms-club-picker" ng-if="vm.clubPicker.length > 1">
  <div class="sms-club-picker__label"><i class="fa fa-building"></i> Club:</div>
  <div class="sms-chips">
    <div class="sms-chip" ng-repeat="c in vm.clubPicker"
         ng-class="{'sms-chip--active': c.id === (vm.club_id + '')}"
         ng-click="vm.selectSmsClub(c.id)">{{ c.name }}</div>
  </div>
</div>
<div class="sms-tabs">
  <div class="sms-tab"
       ng-repeat="item in vm.nav"
       ng-class="{'sms-tab--active': vm.screen === item.screen}"
       ng-click="vm.go(item.state)">
    <i class="fa" ng-class="item.icon"></i> {{ item.label }}
  </div>
</div>
