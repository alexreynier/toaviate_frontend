<div class="sms-page">

  <div class="sms-page__header">
    <div class="sms-page__header-inner">
      <div class="back-box" ui-sref="dashboard.manage_club">
        <i class="fa fa-arrow-circle-left"></i> BACK
      </div>
      <div class="sms-page__title">
        <h2><i class="fa fa-shield-halved"></i> Safety Management System</h2>
        <p>Your club’s safety performance at a glance.</p>
      </div>
      <div class="sms-page__header-actions">
        <a class="sms-btn sms-btn--white" ui-sref="dashboard.manage_club.sms_audit_view">
          <i class="fa fa-magnifying-glass-chart"></i> CAA Audit View
        </a>
        <a class="sms-btn sms-btn--white" ui-sref="dashboard.manage_club.sms_settings" ng-if="vm.access.isAdmin">
          <i class="fa fa-gear"></i> Settings
        </a>
      </div>
    </div>
  </div>

  <div class="sms-page__body">

    <div ng-include="'views/manageclub/sms/_nav.html'"></div>

    <div class="sms-loading" ng-if="vm.loading">
      <div class="sms-spinner"></div> Loading dashboard…
    </div>

    <div ng-if="!vm.loading">

      <!-- SPI tiles -->
      <div class="sms-spi-grid">
        <div class="sms-spi"
             ng-repeat="tile in vm.tiles"
             ng-class="{'sms-spi--red': tile.tone === 'red', 'sms-spi--amber': tile.tone === 'amber', 'sms-spi--violet': tile.tone === 'violet'}"
             ng-click="vm.go(tile.state)">
          <div class="sms-spi__icon"><i class="fa" ng-class="tile.icon"></i></div>
          <div class="sms-spi__body">
            <div class="sms-spi__value" ng-class="{'sms-spi__value--alert': tile.alert && vm.spi[tile.key] > 0}">{{ vm.spi[tile.key] || 0 }}</div>
            <div class="sms-spi__label">{{ tile.label }}</div>
          </div>
        </div>
      </div>

      <!-- Risk band breakdown -->
      <div class="sms-card">
        <div class="sms-card__title"><i class="fa fa-table-cells"></i> Risk Register by Band</div>
        <div style="display:flex; gap:14px; flex-wrap:wrap;">
          <div ng-repeat="band in vm.enums.riskBand" style="flex:1 1 120px; text-align:center; padding:16px; border-radius:12px;"
               ng-class="vm.bandClass(band)">
            <div style="font-size:30px; font-weight:800; line-height:1;">{{ vm.riskBands[band] || 0 }}</div>
            <div style="font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; margin-top:6px;">{{ band }}</div>
          </div>
        </div>
      </div>

      <!-- Trend hint (counts by month, lightweight bars — no chart lib dependency) -->
      <div class="sms-card" ng-if="vm.trends.hazards_by_month || vm.trends.occurrences_by_month">
        <div class="sms-card__title"><i class="fa fa-chart-line"></i> Recent Trend</div>
        <div style="display:flex; gap:24px; flex-wrap:wrap;">
          <div style="flex:1 1 280px;">
            <div style="font-size:12px; font-weight:700; color:#64748b; text-transform:uppercase; margin-bottom:8px;">Hazards / month</div>
            <div style="display:flex; align-items:flex-end; gap:6px; height:70px;">
              <div ng-repeat="pt in vm.trends.hazards_by_month"
                   uib-tooltip="{{ pt.label }}: {{ pt.count }}"
                   style="flex:1; background:linear-gradient(135deg,#1e3a5f,#2d5a8e); border-radius:4px 4px 0 0; min-height:3px;"
                   ng-style="{height: (pt.count ? (pt.count * 12 + 3) : 3) + 'px'}"></div>
            </div>
          </div>
          <div style="flex:1 1 280px;">
            <div style="font-size:12px; font-weight:700; color:#64748b; text-transform:uppercase; margin-bottom:8px;">Occurrences / month</div>
            <div style="display:flex; align-items:flex-end; gap:6px; height:70px;">
              <div ng-repeat="pt in vm.trends.occurrences_by_month"
                   uib-tooltip="{{ pt.label }}: {{ pt.count }}"
                   style="flex:1; background:linear-gradient(135deg,#7c3aed,#a855f7); border-radius:4px 4px 0 0; min-height:3px;"
                   ng-style="{height: (pt.count ? (pt.count * 12 + 3) : 3) + 'px'}"></div>
            </div>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>
