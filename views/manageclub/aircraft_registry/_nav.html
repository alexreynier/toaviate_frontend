<!-- Shared Aircraft-Registry sub-navigation. ng-include'd by every screen. -->
<div class="trk-tabs">
  <div class="trk-tab"
       ng-repeat="item in vm.nav"
       ng-class="{'trk-tab--active': vm.screen === item.screen}"
       ng-click="vm.go(item.state)">
    <i class="fa" ng-class="item.icon"></i> {{ item.label }}
    <span class="areg-nav-alert" ng-if="item.screen === 'advisories' && vm.pending_advisories">{{ vm.pending_advisories }}</span>
  </div>
</div>
