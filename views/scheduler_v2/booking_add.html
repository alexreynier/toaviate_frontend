<!-- Scheduler v2 — New booking panel (state dashboard.scheduler_v2.add, view
     panel@dashboard.scheduler_v2, Bookings2Controller as vm, data.action 'list' +
     data.v2). Slides in over the scheduler, which stays mounted behind it.
     Chrome here; the form body is the shared _booking_form.html. -->
<div class="bkf">
  <div class="bkf-backdrop" ng-click="vm.go_back()"></div>
  <aside class="bkf-panel" role="dialog" aria-modal="true" aria-label="New booking">
    <header class="bkf-panel__hd">
      <div class="bkf-panel__title">
        <h2><i class="fa fa-calendar-plus"></i> New booking</h2>
        <p>Reserve an aircraft</p>
      </div>
      <a ui-sref="dashboard.slot_search" class="bkf-panel__link" ng-if="!vm.is_restricted_member" uib-tooltip="Let the slot finder look for a free slot" tooltip-placement="bottom" tooltip-append-to-body="true"><i class="fa fa-search"></i> <span>Find a slot</span></a>
      <button type="button" class="bkf-panel__close" ng-click="vm.go_back()" aria-label="Close" uib-tooltip="Back to the scheduler" tooltip-placement="bottom" tooltip-append-to-body="true"><i class="fa fa-times"></i></button>
    </header>
    <div class="bkf-panel__body" ng-include="'views/scheduler_v2/_booking_form.html'"></div>
  </aside>
</div>
