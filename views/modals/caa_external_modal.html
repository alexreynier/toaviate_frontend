<!-- CAA forms — send a signature box to an external signer (independent
     examiner without an account). Emails a single-use link, 30-day expiry. -->
<div class="sec-modal">
    <div class="sec-modal__header">
        <i class="fas fa-envelope sec-modal__header-icon"></i>
        <h3 class="sec-modal__title">Send to external {{ vm.roleLabel | lowercase }}</h3>
    </div>

    <form class="sec-modal__body" ng-submit="vm.submit()" novalidate>

        <p class="sec-modal__text">
            They'll get a secure signing link by email — no account needed.
            The link works once and expires after 30 days.
        </p>

        <label class="sec-modal__label" for="caa-ext-email">Email address</label>
        <input type="email" class="sec-modal__input" id="caa-ext-email" ng-model="vm.model.email"
               placeholder="examiner@example.com" />

        <div class="acct-fields acct-fields--two">
            <div class="acct-field">
                <label class="sec-modal__label" for="caa-ext-name">Name (optional)</label>
                <input type="text" class="sec-modal__input" id="caa-ext-name" ng-model="vm.model.name" />
            </div>
            <div class="acct-field">
                <label class="sec-modal__label" for="caa-ext-number">Licence / certificate no. (optional)</label>
                <input type="text" class="sec-modal__input" id="caa-ext-number" ng-model="vm.model.number" />
            </div>
        </div>

        <div class="sec-modal__footer">
            <button type="button" class="sec-btn sec-btn--outline" ng-click="vm.cancel()" ng-disabled="vm.busy">Cancel</button>
            <button type="submit" class="sec-btn sec-btn--primary" ng-disabled="vm.busy">
                <i class="fas" ng-class="vm.busy ? 'fa-spinner fa-spin' : 'fa-paper-plane'"></i>
                {{ vm.busy ? 'Sending…' : 'Send signing link' }}
            </button>
        </div>
    </form>
</div>
