<div class="sec-modal">

    <div class="sec-modal__header">
        <i class="fas fa-pen sec-modal__header-icon"></i>
        <h3 class="sec-modal__title">Rename Passkey</h3>
    </div>

    <div class="sec-modal__body">
        <form ng-submit="vm.submit()">
            <label class="sec-modal__label" for="passkey-rename-label">Name</label>
            <input type="text" id="passkey-rename-label" class="sec-modal__input"
                   ng-model="vm.label" maxlength="60" />
            <div class="sec-modal__footer">
                <button type="button" class="sec-btn sec-btn--outline" ng-click="vm.cancel()" ng-disabled="vm.busy">Cancel</button>
                <button type="submit" class="sec-btn sec-btn--primary" ng-disabled="vm.busy">
                    {{ vm.busy ? 'Saving…' : 'Save' }}
                </button>
            </div>
        </form>
    </div>

</div>
