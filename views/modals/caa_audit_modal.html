<!-- CAA forms — audit trail (newest first, straight from the backend). -->
<div class="sec-modal">
    <div class="sec-modal__header">
        <i class="fas fa-history sec-modal__header-icon"></i>
        <h3 class="sec-modal__title">Audit trail</h3>
    </div>

    <div class="sec-modal__body">

        <div class="sec-loading" ng-if="vm.loading">
            <div class="sec-spinner"></div><span>Loading history…</span>
        </div>

        <div class="caa-audit" ng-if="!vm.loading">
            <div class="caa-audit__empty" ng-show="!vm.entries.length">No history recorded yet.</div>

            <div class="caa-audit__row" ng-repeat="e in vm.entries">
                <span class="caa-audit__icon"><i class="fas" ng-class="vm.icons[e.action] || 'fa-circle'"></i></span>
                <div class="caa-audit__main">
                    <div class="caa-audit__action">
                        {{ vm.pretty(e.action) }}
                        <span class="caa-audit__actor" ng-show="e.actor_name">— {{ e.actor_name }}</span>
                    </div>
                    <div class="caa-audit__details" ng-show="e.details">{{ vm.detailText(e.details) }}</div>
                    <div class="caa-audit__when">{{ e.created_at }}</div>
                </div>
            </div>
        </div>

        <div class="sec-modal__footer">
            <button type="button" class="sec-btn sec-btn--outline" ng-click="vm.close()">Close</button>
        </div>
    </div>
</div>
