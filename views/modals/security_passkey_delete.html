<div class="sec-modal">

    <div class="sec-modal__header sec-modal__header--danger">
        <i class="fas fa-trash-alt sec-modal__header-icon"></i>
        <h3 class="sec-modal__title">Remove Passkey</h3>
    </div>

    <div class="sec-modal__body">
        <p class="sec-modal__text">
            Remove <b>{{ vm.passkey.label }}</b>? It will no longer work for
            signing in. You may also want to delete it from that device's
            password manager. Confirm your password to continue.
        </p>
        <form ng-submit="vm.submit()">
            <label class="sec-modal__label" for="passkey-delete-password">Your password</label>
            <input type="password" id="passkey-delete-password" class="sec-modal__input"
                   ng-model="vm.password" autocomplete="current-password" />
            <div class="sec-modal__footer">
                <button type="button" class="sec-btn sec-btn--outline" ng-click="vm.cancel()" ng-disabled="vm.busy">Cancel</button>
                <button type="submit" class="sec-btn sec-btn--danger" ng-disabled="vm.busy">
                    {{ vm.busy ? 'Removing…' : 'Remove passkey' }}
                </button>
            </div>
        </form>
    </div>

</div>
