<div class="cc-page cc-page--wide">

  <div class="cc-header">
    <div class="back-box" ng-click="vm.back()"><i class="fa fa-arrow-circle-left"></i> BACK</div>
    <h2>
      <i class="fa" ng-class="vm.materialKind === 'video' ? 'fa-film' : 'fa-file-pdf'"></i>
      {{ vm.material.title || 'Material' }}
    </h2>
    <p ng-if="vm.material.original_name">{{ vm.material.original_name }}</p>
    <div class="cc-header__actions">
      <button class="cc-btn cc-btn--white" ng-click="vm.markMaterialDone()" ng-disabled="vm.materialDone || vm.videoProcessing">
        <i class="fa" ng-class="vm.materialDone ? 'fa-circle-check' : 'fa-check'"></i>
        {{ vm.materialDone ? 'Marked as done' : 'Mark as done' }}
      </button>
    </div>
  </div>

  <div class="cc-body">

    <div class="cc-loading" ng-if="vm.loading"><div class="cc-spinner"></div> Loading…</div>

    <!-- Video: still processing -->
    <div class="cc-empty cc-pop" ng-if="!vm.loading && vm.videoProcessing">
      <i class="fa fa-gears fa-spin"></i>
      <p>This video is still being prepared for playback.<br>It’ll start automatically once it’s ready — hang tight.</p>
    </div>

    <!-- Video: failed -->
    <div class="cc-empty" ng-if="!vm.loading && vm.videoFailed">
      <i class="fa fa-triangle-exclamation"></i>
      <p>Sorry — this video couldn’t be processed. Please let your instructor know.</p>
    </div>

    <!-- Video: ready -->
    <div ng-if="!vm.loading && vm.materialKind === 'video' && vm.videoUrl" class="cc-pop">
      <video controls playsinline class="cc-pdf" ng-attr-src="{{ vm.videoUrl }}" style="background:#000;">
        Your browser can’t play this video.
      </video>
    </div>

    <!-- PDF -->
    <div class="snazzy-reveal" ng-if="!vm.loading && vm.materialKind === 'pdf' && vm.pdfUri">
      <object ng-attr-data="{{ vm.pdfUri }}" type="application/pdf" class="cc-pdf">
        <div class="cc-empty">
          <i class="fa fa-file-pdf"></i>
          <p>Your browser can’t display this PDF inline.</p>
        </div>
      </object>
    </div>

  </div>
</div>
