<!-- Shared chrome (header + sub-nav) for the consolidated "Club Documents"
     hub. ng-included at the top of: all_documents.html and
     all_prices.html. Routes/controllers are untouched — this is
     navigation chrome only; both pages already share
     AllDocumentsController. Reuses the .mdnav pill styles from
     css/account.css; shared page geometry is .cdhub-page (same file).

     Both states are leaves (no add/edit children), so unlike
     _documents_nav.html this block needs no state gate — but the header
     lives here for the same reason: one definition, so it can't drift
     between the two tabs. -->
<div class="snazzy-page__header">
    <div class="snazzy-page__header-inner">
        <div class="back-box" ui-sref="dashboard.my_account">
            <i class="fa fa-arrow-circle-left"></i> BACK
        </div>
        <div class="snazzy-page__title">
            <h2><i class="fas fa-building"></i> Club Documents</h2>
            <p>Your club's documents, aircraft paperwork and pricelist</p>
        </div>
    </div>
</div>

<div class="mdnav">
    <a class="mdnav__pill" ui-sref="dashboard.my_account.all_documents" ui-sref-active="mdnav__pill--active">
        <i class="fas fa-folder-open"></i> Documents
    </a>
    <a class="mdnav__pill" ui-sref="dashboard.my_account.all_prices" ui-sref-active="mdnav__pill--active">
        <i class="fas fa-tags"></i> Pricelist
    </a>
</div>
