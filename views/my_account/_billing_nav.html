<!-- Shared chrome (header + sub-nav) for the consolidated "Invoices" hub.
     ng-included at the top of: all_invoices.html and all_payments.html.
     Routes/controllers are untouched — this is navigation chrome only.
     Reuses the .mdnav pill styles from css/account.css; shared page
     geometry is .bilhub-page (same file).

     Both states are leaves (no add/edit children), so unlike
     _documents_nav.html this block needs no state gate — but the header
     lives here for the same reason: one definition, so it can't drift
     between the two tabs. -->
<div class="snazzy-page__header">
    <div class="snazzy-page__header-inner">
        <div class="back-box" ui-sref="dashboard.my_account">
            <i class="fa fa-arrow-circle-left"></i> BACK
        </div>
        <div class="snazzy-page__title">
            <h2><i class="fas fa-file-invoice-dollar"></i> Invoices</h2>
            <p>Your invoices and the payments that settle them</p>
        </div>
    </div>
</div>

<div class="mdnav">
    <a class="mdnav__pill" ui-sref="dashboard.my_account.invoices" ui-sref-active="mdnav__pill--active">
        <i class="fas fa-file-invoice-dollar"></i> Invoices
    </a>
    <a class="mdnav__pill" ui-sref="dashboard.my_account.payments" ui-sref-active="mdnav__pill--active">
        <i class="fas fa-credit-card"></i> Payments
    </a>
</div>
