<div class="payment-add">

  <div class="snazzy-page__header">
    <div class="snazzy-page__header-inner">
      <div class="back-box" ng-click="vm.cancel()">
        <i class="fa fa-arrow-circle-left"></i> BACK
      </div>
      <div class="snazzy-page__title">
        <h2><i class="fas fa-credit-card"></i> ADD A CARD</h2>
        <p>Saved securely with Stripe &mdash; card details never touch our servers</p>
      </div>
    </div>
  </div>

  <!-- club picker (several clubs and none chosen via the list page) -->
  <div class="payment-add__clubs" ng-show="!vm.clubs_loading && vm.clubs.length > 1">
    <p class="payment-add__clubs-label">Which club should this card be saved with?</p>
    <button type="button"
            class="payment-methods__club-btn"
            ng-repeat="club in vm.clubs track by club.club_id"
            ng-class="{'payment-methods__club-btn--active': vm.selected_club.club_id == club.club_id}"
            ng-disabled="vm.setup_loading || vm.submitting"
            ng-click="vm.select_club(club)">
      {{ club.club_name }}
    </button>
  </div>

  <!-- loading -->
  <div class="payment-methods__loading" ng-show="vm.clubs_loading || vm.setup_loading">
    <div class="payment-methods__spinner"></div>
    <span>Preparing the secure card form&hellip;</span>
  </div>

  <!-- error -->
  <div class="payment-methods__error" ng-show="vm.setup_error">
    <i class="fas fa-exclamation-triangle"></i> {{ vm.setup_error }}
  </div>

  <!-- card form — the wrapper uses ng-show (not ng-if) so the #payment-element
       mount target is always present in the DOM when Stripe Elements mounts -->
  <div class="payment-add__panel" ng-show="vm.card_ready">
    <form name="add_card_form" ng-submit="vm.submit_card()" novalidate>
      <div id="payment-element"></div>

      <div class="payment-add__footer">
        <img class="payment-add__stripe-logo" src="images/stripe_blurple.svg" alt="Powered by Stripe" />
        <div class="payment-add__footer-btns">
          <button type="button" class="payment-methods__btn payment-methods__btn--outline"
                  ng-disabled="vm.submitting"
                  ng-click="vm.cancel()">
            Cancel
          </button>
          <button type="submit" class="payment-methods__btn payment-methods__btn--primary"
                  ng-disabled="vm.submitting">
            <span ng-show="!vm.submitting"><i class="fas fa-plus"></i> Save Card</span>
            <span ng-show="vm.submitting">Saving&hellip;</span>
          </button>
        </div>
      </div>
    </form>
  </div>

</div>
