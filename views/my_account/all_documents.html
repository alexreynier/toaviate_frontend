<div class="centre_align_boxes2 documents_page cdhub-page">

  <!-- Hub header + sub-nav. -->
  <div ng-include="'views/my_account/_club_docs_nav.html'"></div>


<div class="sub_section2">
    <!-- The "Search Aircraft" box was removed with the per-aircraft sections:
         there are no aircraft on this page to filter any more, and it fed a
         `!my_search2` condition below that would have HIDDEN the club
         documents the moment anything was typed into it. Aircraft are
         searched on the Aircraft Status page instead. -->
    <div class="search_bar">

        <input type="search" placeholder="Search Documents" ng-model="my_search" class="form-control fifty_wide" />

    </div>

    <div ng-repeat="club in vm.clubs" class="club_docs_all">

        <h2>{{ club.title}}</h2>
        <div ng-if="club.documents.length > 0 && (!my_search || getMySearchCount(club) > 0)" class="plane_docs">
            <div class="card">
             <table>
                    <tr>
                        <td class="bold_text">
                            File Name
                        </td>
                        <td class="centre_text_align bold_text">
                            Click Icon To View
                        </td>
                         <td class="right_text_align bold_text">
                            Last Updated
                        </td>
                    </tr>
                    <tr ng-repeat="document in club.documents | filter: search" vertical-align="middle">
                    
                        <td vertical-align="middle">{{ document.title }}</td>
                        <td class="centre_text_align"> <a ng-click="downloadClubDocument(document.document)"><img class="file_icon" src="{{vm.get_icon2(document.document)}}" /></a></td>
                        <td class="right_text_align" vertical-align="middle">{{ document.updated_at | asDate | date:'d MMM y H:mm' }}</td>

                    </tr>
                </table>
            </div>

        </div>

      <!--    <div ng-if="!my_search2">
                <h5>Charges For Instruction</h5>
                <table ng-if="club.instruction.length > 0">
                    <tr>
                        <td>
                            Instruction
                        </td>
                        <td>
                            Charge Type
                        </td>
                        <td>
                            Charge
                        </td>
                    </tr>
                  
                     <tr ng-repeat="inst in club.instruction | filter: search">
                        <td>
                            {{ inst.title }}
                        </td>
                        <td>
                            Charge per {{ inst.charge_type }} {{ (inst.charge_type == 'session')? "" : "hour" }}
                        </td>
                        <td>
                            £{{ inst.price }}
                        </td>
                    </tr>
                    
                </table>
            </div> -->



        <!-- ── Aircraft documents ──
             Previously this page repeated every aircraft inline: a section
             per plane, its documents, its CRS, and an empty-state for planes
             with none. That buried the club documents above under a long
             scroll and duplicated the Aircraft Status page, which shows the
             same documents PLUS the certificate, insurance, radio licence,
             noise certificate and CRS with their expiry dates.
             One button now sends people to that richer page instead. -->
        <div class="acdocs-link" ng-if="club.planes.length > 0">
            <div class="acdocs-link__text">
                <i class="fas fa-plane acdocs-link__icon"></i>
                <div>
                    <strong>Aircraft documents</strong>
                    <span>Certificates, insurance, radio licence and paperwork for each aircraft</span>
                </div>
            </div>
            <a class="acdocs-link__btn" ui-sref="dashboard.my_account.aircraft_status">
                View aircraft documents <i class="fas fa-arrow-right"></i>
            </a>
        </div>


    </div>



</div>
</div>
