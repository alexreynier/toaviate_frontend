<div class="sms-page">

  <div class="sms-page__header">
    <div class="sms-page__header-inner">
      <div class="back-box" ui-sref="dashboard.my_account.sms">
        <i class="fa fa-arrow-circle-left"></i> BACK
      </div>
      <div class="sms-page__title">
        <h2><i class="fa fa-bullhorn"></i> Safety Bulletins</h2>
        <p>Notices, lessons learned and regulatory updates from your club.</p>
      </div>
    </div>
  </div>

  <div class="sms-page__body">

    <div class="sms-card sms-club-picker" ng-if="vm.multiClub">
      <div class="sms-club-picker__label"><i class="fa fa-building"></i> Club:</div>
      <div class="sms-chips">
        <div class="sms-chip" ng-repeat="c in vm.clubs"
             ng-class="{'sms-chip--active': vm.club_id === c.id}"
             ng-click="vm.selectClub(c.id)">{{ c.name }}</div>
      </div>
    </div>

    <div class="sms-loading" ng-if="vm.loading">
      <div class="sms-spinner"></div> Loading…
    </div>

    <div class="sms-empty" ng-if="!vm.loading && vm.bulletins.length === 0">
      <i class="fa fa-bullhorn"></i>
      <p>No bulletins published yet.</p>
    </div>

    <div ng-if="!vm.loading && vm.bulletins.length > 0">
      <div class="sms-card" ng-repeat="b in vm.bulletins" style="cursor:pointer;" ng-click="vm.toggleBulletin(b)">
        <div style="display:flex; align-items:center; gap:12px;">
          <span class="sms-badge" ng-class="vm.bulletinBadge(b.bulletin_type)">{{ vm.prettyType(b.bulletin_type) }}</span>
          <div style="flex:1; min-width:0;">
            <div style="font-weight:700; color:#1e293b; font-size:15px;">{{ b.title }}</div>
            <div style="font-size:12.5px; color:#94a3b8;">{{ b.published_at || b.created_at }}</div>
          </div>
          <i class="fa" ng-class="vm.openId === b.id ? 'fa-chevron-up' : 'fa-chevron-down'" style="color:#94a3b8;"></i>
        </div>
        <div ng-if="vm.openId === b.id" class="sms-pop"
             style="margin-top:14px; padding-top:14px; border-top:1px solid #eef2f7; color:#475569; font-size:14px; line-height:1.6; white-space:pre-wrap;">{{ b.body }}</div>
      </div>
    </div>

  </div>
</div>
