<div class="sms-page">

  <div class="sms-page__header">
    <div class="sms-page__header-inner">
      <div class="back-box" ui-sref="dashboard.my_account.sms">
        <i class="fa fa-arrow-circle-left"></i> BACK
      </div>
      <div class="sms-page__title">
        <h2><i class="fa fa-bolt"></i> Report an Occurrence</h2>
        <p>An occurrence is something that actually happened — an incident, near-miss or event.</p>
      </div>
    </div>
  </div>

  <div class="sms-page__body">

    <!-- Which club this report is for (switchable when in multiple clubs) -->
    <div class="sms-card sms-club-picker" ng-if="vm.multiClub">
      <div class="sms-club-picker__label">
        <i class="fa fa-building"></i> Reporting to:
      </div>
      <div class="sms-chips">
        <div class="sms-chip"
             ng-repeat="c in vm.clubs"
             ng-class="{'sms-chip--active': vm.club_id === c.id}"
             ng-click="vm.selectClub(c.id)">
          {{ c.name }}
        </div>
      </div>
    </div>

    <!-- 1. Type -->
    <div class="sms-card sms-pop">
      <div class="sms-card__title"><i class="fa fa-layer-group"></i> 1. What type was it?</div>
      <div class="sms-pick-grid">
        <div class="sms-pick"
             ng-repeat="t in vm.enums.occurrenceType"
             ng-class="{'sms-pick--active': vm.occurrence.occurrence_type === t}"
             ng-click="vm.pickType(t)">
          <i class="fa fa-circle-exclamation"></i>
          {{ t.replace('_', ' ') }}
        </div>
      </div>
    </div>

    <!-- 2. Severity -->
    <div class="sms-card">
      <div class="sms-card__title"><i class="fa fa-gauge-high"></i> 2. How serious was it?</div>
      <div class="sms-pick-grid">
        <div class="sms-pick"
             ng-repeat="sv in vm.enums.occurrenceSeverity"
             ng-class="{'sms-pick--active': vm.occurrence.severity === sv}"
             ng-click="vm.pickSeverity(sv)">
          <i class="fa fa-signal"></i>
          {{ sv }}
        </div>
      </div>
    </div>

    <!-- 3. Details -->
    <div class="sms-card">
      <div class="sms-card__title"><i class="fa fa-pen"></i> 3. What happened?</div>
      <div class="sms-form-grid">
        <div class="sms-field sms-field--full">
          <label>Account of events <span class="sms-req">*</span></label>
          <textarea class="sms-textarea" ng-model="vm.occurrence.description"
                    placeholder="Describe what happened, in your own words."></textarea>
        </div>
        <div class="sms-field">
          <label>Aircraft (optional)</label>
          <select class="sms-select" ng-model="vm.occurrence.plane_id">
            <option value="">— none / not applicable —</option>
            <option ng-repeat="p in vm.planes" value="{{ p.id }}">{{ p.registration || p.name }}</option>
          </select>
        </div>
        <div class="sms-field">
          <label>Aerodrome (optional)</label>
          <input class="sms-input" ng-model="vm.occurrence.aerodrome" placeholder="e.g. EGTB">
        </div>
        <div class="sms-field sms-field--full">
          <label>Personnel involved (optional)</label>
          <input class="sms-input" ng-model="vm.occurrence.personnel_involved"
                 placeholder="Names or roles, if relevant">
        </div>
      </div>
    </div>

    <div class="sms-card">
      <button class="sms-btn sms-btn--primary sms-btn--lg sms-btn--block"
              ng-click="vm.submitOccurrence()" ng-disabled="vm.saving">
        <i class="fa" ng-class="{'fa-spinner fa-spin': vm.saving, 'fa-paper-plane': !vm.saving}"></i>
        {{ vm.saving ? 'Reporting…' : 'Submit Occurrence Report' }}
      </button>
    </div>

  </div>
</div>
